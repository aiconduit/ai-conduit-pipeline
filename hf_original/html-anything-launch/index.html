<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=block');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;}
.clip{position:absolute;inset:0;will-change:transform,opacity;}
</style>
</head>
<body>
<div id="root"
  data-composition-id="html-anything-launch"
  data-start="0" data-width="1080" data-height="1920" data-duration="42">

  <!-- Act 1: Hook (0-8s) -->
  <div class="clip" data-composition-id="act1"
       data-composition-src="compositions/act1.html"
       data-start="0" data-duration="8" data-track-index="1"></div>

  <!-- Act 2: What it does (8-20s) -->
  <div class="clip" data-composition-id="act2"
       data-composition-src="compositions/act2.html"
       data-start="8" data-duration="12" data-track-index="2"></div>

  <!-- Act 3: Terminal demo (20-33s) -->
  <div class="clip" data-composition-id="act3"
       data-composition-src="compositions/act3.html"
       data-start="20" data-duration="13" data-track-index="3"></div>

  <!-- Act 4: CTA (33-42s) -->
  <div class="clip" data-composition-id="act4"
       data-composition-src="compositions/act4.html"
       data-start="33" data-duration="9" data-track-index="4"></div>

</div>
<script>window.__timelines = window.__timelines || {};</script>
</body>
</html>
