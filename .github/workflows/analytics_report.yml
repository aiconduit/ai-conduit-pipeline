name: AI Conduit Analytics 毎朝分析レポート

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # 毎朝7:00 JST

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install google-auth-oauthlib google-api-python-client requests --break-system-packages -q

      - name: YouTube Analytics 分析実行
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 sns_automation/scripts/youtube_analytics.py

      - name: レポートをコミット
        run: |
          git config user.email "analytics@aiconduit.com"
          git config user.name "AI Conduit Analytics"
          git add analytics/ || true
          git diff --staged --quiet || git commit -m "Auto: アナリティクスレポート $(date +%Y%m%d)"
          git push || true
