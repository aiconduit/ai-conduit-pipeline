name: AI Conduit アナリティクス収集・改善レポート
on:
  schedule:
    - cron: '0 13 * * *'  # 毎日22:00 JST（動画投稿1時間後）
  workflow_dispatch:

jobs:
  collect_analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests
      - name: アナリティクス収集
        run: python3 sns_automation/scripts/analytics_collector.py
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      - name: レポートをartifactに保存
        uses: actions/upload-artifact@v4
        with:
          name: analytics-report-${{ github.run_number }}
          path: analytics/
        if: always()
