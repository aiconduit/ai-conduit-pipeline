name: AI Conduit パイプライン4 Verticals v3 Tech

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'  # 毎日22:00 JST

jobs:
  generate_video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install git+https://github.com/rushindrasinha/youtube-shorts-pipeline.git --break-system-packages -q
          pip install edge-tts google-cloud-texttospeech --break-system-packages -q
          sudo apt-get install -y ffmpeg --quiet
      
      - name: 設定ファイル作成（DeepSeek + Edge TTS）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p ~/.verticals
          cat > ~/.verticals/config.json << CONF
          {
            "openai_api_key": "${{ secrets.DEEPSEEK_API_KEY }}",
            "openai_base_url": "https://api.deepseek.com",
            "openai_model": "deepseek-chat",
            "pexels_api_key": "${{ secrets.PEXELS_API_KEY }}",
            "tts_provider": "edge",
            "voice_id_en": "en-US-GuyNeural"
          }
          CONF
          echo "設定完了"
      
      - name: Verticals v3 動画生成
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          TOPICS=(
            "Claude Code just killed the code review meeting"
            "OpenAI Codex CLI vs Claude Code one of these wins"
            "This Claude Code flag deleted 3 hours of my daily work"
            "Gemini CLI can now read your entire codebase in one shot"
            "GitHub Copilot just made a move nobody expected"
          )
          IDX=$((RANDOM % ${#TOPICS[@]}))
          TOPIC="${TOPICS[$IDX]}"
          echo "トピック: $TOPIC"
          
          OPENAI_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
          OPENAI_BASE_URL="https://api.deepseek.com" \
          PEXELS_API_KEY="${{ secrets.PEXELS_API_KEY }}" \
          python3 -m verticals run \
            --topic "$TOPIC" \
            --niche tech \
            --provider openai \
            --voice edge \
            --lang en \
            --no-upload 2>&1 || echo "⚠️ Verticals失敗"
          
          ls ~/.verticals/media/ 2>/dev/null && echo "動画生成完了"
      
      - name: YouTube投稿
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 sns_automation/scripts/youtube_auto_upload.py || echo "⚠️ YouTube投稿スキップ"
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-video
          path: ~/.verticals/media/
          retention-days: 3
