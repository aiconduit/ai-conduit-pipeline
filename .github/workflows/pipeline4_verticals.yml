name: AI Conduit Pipeline 4 Verticals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install git+https://github.com/rushindrasinha/youtube-shorts-pipeline.git -q
          sudo apt-get install -y ffmpeg -q

      - name: Generate and Produce
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 -c "
          import requests, json, random, os
          from pathlib import Path
          KEY = 'sk-71eab12699f047a5891e62268c66c241'
          topics = ['Claude Code just killed the code review meeting', 'OpenAI Codex CLI vs Claude Code one wins', 'This Claude Code flag deleted 3 hours of work']
          topic = random.choice(topics)
          print('Topic:', topic)
          r = requests.post('https://api.deepseek.com/chat/completions', headers={'Authorization': f'Bearer {KEY}', 'Content-Type': 'application/json'}, json={'model': 'deepseek-chat', 'messages': [{'role': 'user', 'content': f'Write a 60-second YouTube Short script about: {topic}. Style: Fireship. 150-170 words. Fast punchy no filler. End: Follow for daily tech breakdowns.'}], 'max_tokens': 300}, timeout=30)
          script = r.json()['choices'][0]['message']['content'].strip()
          print('Script:', script[:80])
          Path(os.path.expanduser('~/.verticals/drafts')).mkdir(parents=True, exist_ok=True)
          draft = {'news': topic, 'script': script, 'youtube_title': topic, 'youtube_description': 'Follow for daily AI and tech breakdowns.', 'broll_prompts': ['developer coding terminal', 'AI technology futuristic', 'code review screen'], 'niche': 'tech', 'platform': 'shorts', 'job_id': 'p4', 'stage': {'research': True, 'draft': True}}
          json.dump(draft, open(os.path.expanduser('~/.verticals/drafts/p4.json'), 'w'))
          print('Draft saved')
          "
          python3 -m verticals produce --draft ~/.verticals/drafts/p4.json --voice edge --lang en || echo "produce failed"
          ls ~/.verticals/media/ 2>/dev/null || echo "no media"

      - name: Upload YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          # Verticals動画をprojects/daily/rendersにコピー（トピック名でリネーム）
          mkdir -p projects/daily/renders
          TOPIC=$(python3 -c "import json; d=json.load(open(os.path.expanduser('~/.verticals/drafts/p4.json'))); print(d['news'][:40])" 2>/dev/null || echo "AI Tech News")
          cp ~/.verticals/media/*.mp4 "projects/daily/renders/v2news_${TOPIC}.mp4" 2>/dev/null || echo "no video"
          ls projects/daily/renders/
          python3 sns_automation/scripts/youtube_auto_upload.py || echo "upload skipped"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-video
          path: ~/.verticals/media/
          retention-days: 3
