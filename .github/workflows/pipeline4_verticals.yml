name: AI Conduit パイプライン4 Verticals v3 Tech

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'  # 毎日22:00 JST

jobs:
  generate_video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Verticals v3
        run: |
          pip install git+https://github.com/rushindrasinha/youtube-shorts-pipeline.git --break-system-packages -q
          pip install edge-tts ffmpeg-python --break-system-packages -q
          sudo apt-get install -y ffmpeg imagemagick --quiet
      
      - name: トピック生成（Claude Code / AI Tools）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os, random
          
          DEEPSEEK_KEY = os.environ.get("DEEPSEEK_API_KEY", "sk-71eab12699f047a5891e62268c66c241")
          
          # Claude Code/AIツール系のトピック生成
          topics = [
              "Claude Code --dangerously-skip-permissions flag just changed how I work",
              "OpenAI Codex CLI vs Claude Code: one of these wins and it's not close",
              "This Claude Code feature deleted 3 hours of my daily work",
              "GitHub just made Claude Code free for students",
              "Gemini CLI can now read your entire codebase in one shot",
          ]
          
          selected = random.choice(topics)
          print(f"選択トピック: {selected}")
          
          with open('/tmp/p4_topic.txt', 'w') as f:
              f.write(selected)
          PYEOF
      
      - name: Verticals v3 動画生成
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          TOPIC=$(cat /tmp/p4_topic.txt)
          echo "トピック: $TOPIC"
          python3 -m verticals run \
            --topic "$TOPIC" \
            --niche tech \
            --tts-provider edge \
            --llm-provider openai \
            --llm-base-url https://api.deepseek.com \
            --llm-model deepseek-chat \
            --no-upload \
            --output-dir /tmp/p4_output || echo "⚠️ Verticals失敗"
          ls /tmp/p4_output/ 2>/dev/null || echo "出力なし"
      
      - name: YouTube投稿
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 sns_automation/scripts/youtube_auto_upload.py
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-video
          path: /tmp/p4_output/
          retention-days: 3
