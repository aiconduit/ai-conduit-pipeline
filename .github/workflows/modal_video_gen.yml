name: Modal GPU 動画生成

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Modal で Wan2.2 動画生成
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          pip install modal -q
          modal token set --token-id $MODAL_TOKEN_ID --token-secret $MODAL_TOKEN_SECRET
          echo "✅ Modal認証完了"
          
          # まずGPU環境テスト
          python3 -c "
import modal
app = modal.App('gpu-test')
image = modal.Image.debian_slim().pip_install('torch')

@app.function(gpu='T4', image=image, timeout=60)
def check_gpu():
    import torch
    return f'GPU: {torch.cuda.get_device_name(0)}, VRAM: {torch.cuda.get_device_properties(0).total_memory // 1024**3}GB'

with modal.enable_output():
    with app.run():
        result = check_gpu.remote()
        print(result)
"
