name: YouTube Cleanup
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete all videos except figma-launch
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        shell: python3 {0}
        run: |
          import os, requests, time

          KEEP_VIDEO_ID = "-m8hTZQUPkY"

          r = requests.post("https://oauth2.googleapis.com/token", data={
              "grant_type": "refresh_token",
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
              "client_id": os.environ["YOUTUBE_CLIENT_ID"],
              "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
          })
          token = r.json().get("access_token", "")
          headers = {"Authorization": f"Bearer {token}"}

          # 全動画取得（ページネーション対応）
          all_videos = []
          next_page = None
          while True:
              params = {"part": "snippet", "forMine": "true", "type": "video", "maxResults": 50}
              if next_page:
                  params["pageToken"] = next_page
              r2 = requests.get("https://www.googleapis.com/youtube/v3/search", params=params, headers=headers)
              data = r2.json()
              all_videos.extend(data.get("items", []))
              next_page = data.get("nextPageToken")
              if not next_page:
                  break

          print(f"総動画数: {len(all_videos)}")
          deleted = 0
          for item in all_videos:
              vid = item["id"]["videoId"]
              title = item["snippet"]["title"]
              if vid == KEEP_VIDEO_ID:
                  print(f"  KEEP: {vid}: {title}")
                  continue
              r3 = requests.delete(
                  f"https://www.googleapis.com/youtube/v3/videos",
                  params={"id": vid},
                  headers=headers
              )
              if r3.status_code == 204:
                  print(f"  ✅ 削除: {vid}: {title}")
                  deleted += 1
              else:
                  print(f"  ❌ 失敗: {vid}: {r3.status_code}")
              time.sleep(0.5)

          print(f"\n削除完了: {deleted}本")
