name: Kaggle Screen Recording
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL to record
        required: true
        default: 'https://open-design.ai/html-anything/'
      sample_name:
        description: Sample name
        required: true
        default: 'html-anything-launch'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Push recording kernel to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          pip install requests -q
          python3 << 'EOF'
import os, json, requests, zipfile, tempfile, time

user = os.environ["KAGGLE_USERNAME"]
key = os.environ["KAGGLE_KEY"]
auth = (user, key)
target_url = os.environ["TARGET_URL"]

kernel_code = f"""
import subprocess, os, time

# 依存インストール
subprocess.run(["pip", "install", "playwright", "-q"], check=False)
subprocess.run(["playwright", "install", "chromium", "--with-deps"], check=False)

# xvfb起動
subprocess.Popen(["Xvfb", ":99", "-screen", "0", "1920x1080x24"])
os.environ["DISPLAY"] = ":99"
time.sleep(2)

# ffmpeg録画開始（25秒）
ffmpeg_proc = subprocess.Popen([
    "ffmpeg", "-y",
    "-f", "x11grab", "-framerate", "30",
    "-video_size", "1920x1080", "-i", ":99",
    "-t", "25",
    "-vcodec", "libx264", "-profile:v", "baseline", "-level:v", "3.1",
    "-pix_fmt", "yuv420p", "-movflags", "+faststart",
    "-acodec", "aac", "-ar", "44100",
    "-crf", "18", "-preset", "fast",
    "/tmp/screen_raw.mp4"
])

# Playwright でブラウザ操作
import asyncio
from playwright.async_api import async_playwright

async def browse():
    async with async_playwright() as p:
        browser = await p.chromium.launch(
            headless=False,
            args=["--no-sandbox","--disable-setuid-sandbox","--window-size=1920,1080","--start-maximized"]
        )
        ctx = await browser.new_context(viewport={{"width":1920,"height":1080}})
        page = await ctx.new_page()
        print(f"Navigating to {target_url}")
        try:
            await page.goto("{target_url}", wait_until="networkidle", timeout=20000)
        except:
            await page.goto("{target_url}", timeout=20000)
        await page.wait_for_timeout(3000)
        await page.evaluate("window.scrollTo({{top:400,behavior:'smooth'}})")
        await page.wait_for_timeout(2500)
        await page.evaluate("window.scrollTo({{top:900,behavior:'smooth'}})")
        await page.wait_for_timeout(2500)
        await page.evaluate("window.scrollTo({{top:1400,behavior:'smooth'}})")
        await page.wait_for_timeout(2500)
        await page.evaluate("window.scrollTo({{top:0,behavior:'smooth'}})")
        await page.wait_for_timeout(3000)
        await browser.close()

asyncio.run(browse())
ffmpeg_proc.wait()

import os
size = os.path.getsize("/tmp/screen_raw.mp4") if os.path.exists("/tmp/screen_raw.mp4") else 0
print(f"録画完了: {{size//1024}}KB")

# Kaggle Output にコピー
import shutil, pathlib
pathlib.Path("/kaggle/working").mkdir(exist_ok=True)
shutil.copy("/tmp/screen_raw.mp4", "/kaggle/working/screen_raw.mp4")
print("出力完了: /kaggle/working/screen_raw.mp4")
"""

meta = {{
    "id": f"{{user}}/hf-screen-recording",
    "title": "HF Screen Recording",
    "code_file": "kernel.py",
    "language": "python",
    "kernel_type": "script",
    "is_private": True,
    "enable_gpu": False,
    "enable_internet": True,
    "dataset_sources": [],
    "competition_sources": [],
    "kernel_sources": []
}}

with tempfile.TemporaryDirectory() as d:
    open(f"{{d}}/kernel.py", "w").write(kernel_code)
    json.dump(meta, open(f"{{d}}/kernel-metadata.json", "w"))
    z = f"{{d}}/k.zip"
    with zipfile.ZipFile(z, "w") as zf:
        zf.write(f"{{d}}/kernel.py", "kernel.py")
        zf.write(f"{{d}}/kernel-metadata.json", "kernel-metadata.json")
    with open(z, "rb") as f:
        r = requests.post("https://www.kaggle.com/api/v1/kernels/push",
                         auth=auth, files={{"file": ("k.zip", f, "application/zip")}}, timeout=30)
    print(f"Push: {r.status_code} {r.text[:200]}")

EOF

      - name: Wait for Kaggle kernel completion
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install requests -q
          python3 << 'EOF'
import os, requests, time

user = os.environ["KAGGLE_USERNAME"]
key = os.environ["KAGGLE_KEY"]
auth = (user, key)
kernel_slug = f"{user}/hf-screen-recording"

print("Kaggleカーネル完了待ち...")
for i in range(30):
    r = requests.get(f"https://www.kaggle.com/api/v1/kernels/{kernel_slug}",
                    auth=auth, timeout=10)
    if r.status_code == 200:
        data = r.json()
        status = data.get("currentRunningVersion", {}).get("status", "unknown")
        print(f"  {i*20}s: {status}")
        if status in ["complete", "error", "cancelAcknowledged"]:
            print(f"完了: {status}")
            break
    time.sleep(20)
EOF

      - name: Download recording from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kaggle -q
          export KAGGLE_USERNAME=${{ secrets.KAGGLE_USERNAME }}
          export KAGGLE_KEY=${{ secrets.KAGGLE_KEY }}
          # カーネル出力をダウンロード
          kaggle kernels output ${{ secrets.KAGGLE_USERNAME }}/hf-screen-recording -p /tmp/kaggle_output/ 2>&1 || true
          ls -lh /tmp/kaggle_output/ 2>/dev/null || echo "出力なし"
          if [ -f /tmp/kaggle_output/screen_raw.mp4 ]; then
            cp /tmp/kaggle_output/screen_raw.mp4 ./screen_raw.mp4
            echo "✅ 録画ダウンロード成功"
            ls -lh screen_raw.mp4
          else
            echo "⚠️ 録画なし - フォールバック（静止画使用）"
          fi

      - name: Upload recording artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-recording-${{ github.run_number }}
          path: screen_raw.mp4
          retention-days: 3
