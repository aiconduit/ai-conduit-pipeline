name: Kaggle Screen Recording
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL to record
        required: true
        default: 'https://open-design.ai/html-anything/'
      sample_name:
        description: Sample name
        required: true
        default: 'html-anything-launch'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install and push to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          pip install requests -q
          python3 kaggle_screen_record.py

      - name: Wait and download from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kaggle requests -q
          python3 << 'EOF'
import os, requests, time
user = os.environ["KAGGLE_USERNAME"]
key = os.environ["KAGGLE_KEY"]
auth = (user, key)
slug = f"{user}/hf-screen-recording"
print("Waiting for Kaggle kernel...")
for i in range(40):
    r = requests.get(f"https://www.kaggle.com/api/v1/kernels/{slug}", auth=auth, timeout=10)
    if r.status_code == 200:
        status = r.json().get("currentRunningVersion", {}).get("status", "unknown")
        print(f"  {i*15}s: {status}")
        if status in ["complete", "error"]:
            print(f"Done: {status}")
            break
    time.sleep(15)
EOF
          export KAGGLE_USERNAME=${{ secrets.KAGGLE_USERNAME }}
          export KAGGLE_KEY=${{ secrets.KAGGLE_KEY }}
          kaggle kernels output ${{ secrets.KAGGLE_USERNAME }}/hf-screen-recording -p /tmp/kout/ || true
          ls -lh /tmp/kout/ 2>/dev/null || echo "no output"
          [ -f /tmp/kout/screen_raw.mp4 ] && cp /tmp/kout/screen_raw.mp4 ./screen_raw.mp4 && echo "Downloaded" || echo "No recording"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-recording-${{ github.run_number }}
          path: screen_raw.mp4
          retention-days: 3
