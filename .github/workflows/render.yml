name: Render Video

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'GitHub repo (e.g. MadsLorentzen/ai-job-search)'
        required: true
        default: 'MadsLorentzen/ai-job-search'
      stars:
        description: 'Star count'
        required: true
        default: '17500'
      description:
        description: 'Description'
        required: true
        default: 'Claude Codeで就活を自動化するフレームワーク'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-urw-base35 \
            fonts-noto-cjk-extra \
            libass-dev

      - name: Install Python deps
        run: pip install requests edge-tts faster-whisper pysubs2 openai-whisper pillow numpy

      - name: Run ffmpeg pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 ffmpeg_pipeline_v2.py \
            "${{ github.event.inputs.repo }}" \
            "${{ github.event.inputs.stars }}" \
            "${{ github.event.inputs.description }}"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: |
            projects/daily/renders/*_final.mp4
            /tmp/ai_conduit_v2/character_lipsync.mp4
            /tmp/ai_conduit_v2/stacked.mp4
          retention-days: 7
