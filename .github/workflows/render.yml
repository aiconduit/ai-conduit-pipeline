name: Render Video

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'GitHub repo (e.g. MadsLorentzen/ai-job-search)'
        required: true
        default: 'MadsLorentzen/ai-job-search'
      stars:
        description: 'Star count'
        required: true
        default: '17500'
      description:
        description: 'Description'
        required: true
        default: 'Claude Codeで就活を自動化するフレームワーク'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            imagemagick \
            libmagic1 \
            python3-dev

      - name: Install Python deps
        run: |
          pip install requests edge-tts moviepy openai-whisper pillow

      - name: Install Node deps
        run: |
          cd remotion-composer
          npm install

      - name: Install Remotion Chrome
        run: |
          cd remotion-composer
          npx remotion browser ensure

      - name: Run full pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 auto_content_pipeline.py \
            "${{ github.event.inputs.repo }}" \
            "${{ github.event.inputs.stars }}" \
            "${{ github.event.inputs.description }}"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: projects/daily/renders/*_final.mp4
          retention-days: 7
