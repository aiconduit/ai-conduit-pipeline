name: Test Render Vertical
on:
  workflow_dispatch:
    inputs:
      sample_name:
        description: Sample name
        required: true
        default: figma-launch
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          sudo apt-get install -y ffmpeg git-lfs --no-install-recommends -qq
          npm install -g hyperframes --ignore-scripts
      - name: Clone sample
        run: |
          git lfs install
          git clone --depth=1 https://github.com/heygen-com/hyperframes-launches.git hf_launches
          cd hf_launches && git lfs pull --include="${{ github.event.inputs.sample_name }}/**"
      - name: Convert to vertical
        env:
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        shell: python3 {0}
        run: |
          import re, os
          name = os.environ['SAMPLE_NAME']
          src = f"hf_launches/{name}"
          idx_html = open(f"{src}/index.html").read()
          dw = re.search(r'data-width="(\d+)"', idx_html)
          dh = re.search(r'data-height="(\d+)"', idx_html)
          orig_w = int(dw.group(1)) if dw else 1080
          orig_h = int(dh.group(1)) if dh else 1080
          canvas_w, canvas_h = 1080, 1920
          left_offset = (canvas_w - orig_w) / 2
          top_offset = (canvas_h - orig_h) / 2
          audio_p = re.compile(r'<audio[^>]*>.*?</audio>', re.DOTALL)
          hf_p = re.compile(r'<hf-audio[^>]*/>')
          css = f"<style>html,body{{width:{canvas_w}px!important;height:{canvas_h}px!important;margin:0!important;background:#000!important;overflow:hidden!important;}}.hf-stage-wrapper{{position:absolute;left:{left_offset}px;top:{top_offset}px;width:{orig_w}px;height:{orig_h}px;overflow:hidden;}}.hf-character{{position:absolute;bottom:0;right:0;width:320px;height:auto;z-index:100;}}</style>"
          char_img = '<img class="hf-character" src="../assets/character_main.png" />'
          comp_dir = f"{src}/compositions"
          if os.path.exists(comp_dir):
              for f in sorted(os.listdir(comp_dir)):
                  if not f.endswith('.html'): continue
                  p = f"{comp_dir}/{f}"
                  h = open(p).read()
                  h = audio_p.sub('', h)
                  h = hf_p.sub('', h)
                  h = re.sub(r'<meta name="viewport"[^>]*>', f'<meta name="viewport" content="width={canvas_w}, height={canvas_h}" />', h)
                  h = h.replace(f'data-width="{orig_w}"', f'data-width="{canvas_w}"')
                  h = h.replace(f'data-height="{orig_h}"', f'data-height="{canvas_h}"')
                  h = h.replace('</head>', css + '</head>')
                  h = re.sub(r'(<body[^>]*>)(.*?)(</body>)', lambda m: m.group(1)+'<div class="hf-stage-wrapper">'+m.group(2)+'</div>'+char_img+m.group(3), h, flags=re.DOTALL)
                  open(p, 'w').write(h)
          h = open(f"{src}/index.html").read()
          h = audio_p.sub('', h)
          h = hf_p.sub('', h)
          h = re.sub(r'<meta name="viewport"[^>]*>', f'<meta name="viewport" content="width={canvas_w}, height={canvas_h}" />', h)
          h = h.replace(f'data-width="{orig_w}"', f'data-width="{canvas_w}"')
          h = h.replace(f'data-height="{orig_h}"', f'data-height="{canvas_h}"')
          open(f"{src}/index.html", 'w').write(h)
          # キャラクター画像をassetsにコピー
          import shutil
          char_src = "test_render/character_main.png"
          char_dst = f"{src}/assets/character_main.png"
          if os.path.exists(char_src):
              shutil.copy(char_src, char_dst)
              print("character copied")
          print("done")
      - name: Render
        run: |
          HF_VIDEO_COVERAGE_THRESHOLD=0 hyperframes render hf_launches/${{ github.event.inputs.sample_name }} -o raw.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 raw.mp4
          ls -lh raw.mp4

      - name: Add character overlay
        run: |
          # キャラクター画像をffmpegでオーバーレイ（右下）
          ffmpeg -y             -i raw.mp4             -i test_render/character_main.png             -filter_complex "[1:v]scale=700:-1[char];[0:v][char]overlay=W-w-10:H-h-10"             -c:a copy output.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output.mp4
          ls -lh output.mp4
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-vertical-${{ github.run_number }}
          path: output.mp4
          retention-days: 3
