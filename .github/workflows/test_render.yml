name: Test Render Vertical
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install -g hyperframes --ignore-scripts
      - name: Render
        run: |
          HF_VIDEO_COVERAGE_THRESHOLD=0 hyperframes render test_render/var_scale -o output.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output.mp4
          ls -lh output.mp4
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-vertical-${{ github.run_number }}
          path: output.mp4
          retention-days: 3
