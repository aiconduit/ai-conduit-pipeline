name: Test Render Vertical
on:
  workflow_dispatch:
    inputs:
      sample_name:
        description: Sample name
        required: true
        default: figma-launch
      upload:
        description: 'Upload to YouTube (true/false)'
        required: false
        default: 'false'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get install -y ffmpeg git-lfs fonts-noto-cjk --no-install-recommends -qq
          pip install edge-tts --quiet
          npm install -g hyperframes --ignore-scripts
      - name: Clone sample
        run: |
          git lfs install
          git clone --depth=1 https://github.com/heygen-com/hyperframes-launches.git hf_launches
          cd hf_launches && git lfs pull --include="${{ github.event.inputs.sample_name }}/**"
      - name: Convert to vertical
        env:
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        shell: python3 {0}
        run: |
          import re, os, shutil
          name = os.environ["SAMPLE_NAME"]
          src = f"hf_launches/{name}"
          idx_html = open(f"{src}/index.html").read()
          dw = re.search(r'data-width="(\d+)"', idx_html)
          dh = re.search(r'data-height="(\d+)"', idx_html)
          orig_w = int(dw.group(1)) if dw else 1080
          orig_h = int(dh.group(1)) if dh else 1080
          canvas_w, canvas_h = 1080, 1920
          # スケールして中央配置（横幅に合わせてスケールダウン）
          if orig_w > canvas_w:
              scale = canvas_w / orig_w
              scaled_w = canvas_w
              scaled_h = int(orig_h * scale)
              left_offset = 0
              top_offset = (canvas_h - scaled_h) / 2
          else:
              scale = 1.0
              scaled_w = orig_w
              scaled_h = orig_h
              left_offset = (canvas_w - orig_w) / 2
              top_offset = (canvas_h - orig_h) / 2
          audio_p = re.compile(r"<audio[^>]*>.*?</audio>", re.DOTALL)
          hf_p = re.compile(r"<hf-audio[^>]*/?>")
          css = f"<style>html,body{{width:{canvas_w}px!important;height:{canvas_h}px!important;margin:0!important;background:#000!important;overflow:hidden!important;}}.hf-stage-wrapper{{position:absolute;left:0px;top:{top_offset}px;width:{orig_w}px;height:{orig_h}px;transform:scale({scale});transform-origin:top left;overflow:hidden;}}</style>"
          comp_dir = f"{src}/compositions"
          if os.path.exists(comp_dir):
              for f in sorted(os.listdir(comp_dir)):
                  if not f.endswith(".html"): continue
                  p = f"{comp_dir}/{f}"
                  h = open(p).read()
                  h = audio_p.sub("", h)
                  h = hf_p.sub("", h)
                  h = re.sub(r'<meta name="viewport"[^>]*>', f'<meta name="viewport" content="width={canvas_w}, height={canvas_h}" />', h)
                  h = h.replace(f'data-width="{orig_w}"', f'data-width="{canvas_w}"')
                  h = h.replace(f'data-height="{orig_h}"', f'data-height="{canvas_h}"')
                  h = h.replace("</head>", css + "</head>")
                  h = re.sub(r"(<body[^>]*>)(.*?)(</body>)", lambda m: m.group(1)+"<div class=\"hf-stage-wrapper\">"+m.group(2)+"</div>"+m.group(3), h, flags=re.DOTALL)
                  open(p, "w").write(h)
          h = open(f"{src}/index.html").read()
          h = audio_p.sub("", h)
          h = hf_p.sub("", h)
          h = re.sub(r'<meta name="viewport"[^>]*>', f'<meta name="viewport" content="width={canvas_w}, height={canvas_h}" />', h)
          h = h.replace(f'data-width="{orig_w}"', f'data-width="{canvas_w}"')
          h = h.replace(f'data-height="{orig_h}"', f'data-height="{canvas_h}"')
          open(f"{src}/index.html", "w").write(h)
          # キャラクター画像コピー
          char_src = "test_render/character_main.png"
          char_dst = f"{src}/assets/character_main.png"
          if os.path.exists(char_src):
              shutil.copy(char_src, char_dst)
          print("done")
      - name: Render
        run: |
          HF_VIDEO_COVERAGE_THRESHOLD=0 hyperframes render hf_launches/${{ github.event.inputs.sample_name }} -o raw.mp4
          ls -lh raw.mp4
      - name: Generate TTS and caption composition
        env:
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        run: |
          pip install edge-tts --quiet 2>/dev/null
          python3 scripts/gen_caption_composition.py             "$SAMPLE_NAME"             narration.mp3             captions.html             narration.srt
          echo "✅ TTS+字幕composition生成完了"
          ls -lh narration.mp3 narration.srt 2>/dev/null || true
      - name: Merge video audio character subtitles
        run: |
          # SRT→ASSに変換
          python3 scripts/gen_subtitle_filter.py narration.srt narration.ass
          echo "ASS生成: $(wc -l < narration.ass)行"

          # libassサポート確認
          ffmpeg -filters 2>&1 | grep -i "ass" | head -3

          # キャラ + 音声 + ASS字幕を合成
          if ffmpeg -filters 2>&1 | grep -q "^.*ass"; then
            ffmpeg -y \
              -i raw.mp4 -i test_render/character_main.png -i narration.mp3 \
              -filter_complex "[1:v]scale=iw*0.65:-1[char];[0:v][char]overlay=W-w-20:H-h-100[vchar];[vchar]ass=narration.ass[vout]" \
              -map "[vout]" -map "2:a" \
              -c:v libx264 -c:a aac -pix_fmt yuv420p output.mp4
            echo "ASS字幕あり合成完了"
          else
            echo "libass未対応 → drawtext使用"
            SUBFILTER=$(python3 scripts/gen_subtitle_filter.py narration.srt 2>/dev/null || echo "")
            ffmpeg -y \
              -i raw.mp4 -i test_render/character_main.png -i narration.mp3 \
              -filter_complex "[1:v]scale=iw*0.65:-1[char];[0:v][char]overlay=W-w-20:H-h-100[vchar];[vchar]${SUBFILTER}[vout]" \
              -map "[vout]" -map "2:a" \
              -c:v libx264 -c:a aac -pix_fmt yuv420p output.mp4
          fi
          ls -lh output.mp4
      - name: Upload to YouTube
        if: ${{ github.event.inputs.upload == 'true' }}
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        shell: python3 {0}
        run: |
          import os, requests
          from pathlib import Path
          sample_name = os.environ.get("SAMPLE_NAME", "figma-launch")
          gift_url = f"https://aiconduit.github.io/gifts/#{sample_name}"
          titles = {
            "figma-launch": "FigmaのデザインをHyperFramesで動画化する方法 #Shorts",
            "variables-launch": "HyperFramesのVariables機能で動画を自動生成する方法 #Shorts",
            "spacex-launch": "Claude Code + HyperFramesでシネマティック動画を作る方法 #Shorts",
            "cloud-render-launch": "GitHub Actions + HyperFramesで動画を完全自動投稿する方法 #Shorts",
            "hyperframes-launch": "HyperFramesとは何か？HTMLで動画を作るOSSフレームワーク #Shorts",
          }
          title = titles.get(sample_name, f"HyperFrames {sample_name} #Shorts")
          description = f"コメントに「AI Conduit」と書くとソースコードを受け取れます。\n\n今回のテンプレート配布ページ:\n{gift_url}\n\n役に立ったらいいねと保存をお願いします。\n\nGitHub: https://github.com/aiconduit\n#HyperFrames #ClaudeCode #AI自動化 #Shorts"
          r = requests.post("https://oauth2.googleapis.com/token", data={
              "grant_type": "refresh_token",
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
              "client_id": os.environ["YOUTUBE_CLIENT_ID"],
              "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
          })
          token = r.json().get("access_token", "")
          if not token:
              print(f"トークン取得失敗: {r.text}")
              exit(1)
          metadata = {
              "snippet": {"title": title[:100], "description": description, "tags": ["HyperFrames","ClaudeCode","AI自動化","Shorts"], "categoryId": "28", "defaultLanguage": "ja"},
              "status": {"privacyStatus": "public", "selfDeclaredMadeForKids": False}
          }
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          r2 = requests.post(
              "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status",
              headers=headers, json=metadata)
          upload_url = r2.headers.get("Location", "")
          if not upload_url:
              print(f"アップロードURL取得失敗: {r2.status_code}")
              exit(1)
          video_path = Path("output.mp4")
          video_size = video_path.stat().st_size
          with open(video_path, "rb") as f:
              r3 = requests.put(upload_url, data=f, headers={"Content-Length": str(video_size), "Content-Type": "video/mp4"})
          if r3.status_code in [200, 201]:
              video_id = r3.json().get("id", "")
              print(f"✅ YouTube投稿成功: https://youtube.com/shorts/{video_id}")
          else:
              print(f"❌ 投稿失敗: {r3.status_code}")
              exit(1)
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-vertical-${{ github.run_number }}
          path: output.mp4
          retention-days: 3
