name: Render Video V3

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'GitHub repo (e.g. owner/repo-name)'
        required: true
        default: 'MadsLorentzen/ai-job-search'
      stars:
        description: 'Star count'
        required: true
        default: '17500'
      description:
        description: 'Description'
        required: true
        default: 'Claude Codeで就活を自動化するフレームワーク'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Python deps
        run: pip install requests pillow numpy

      - name: Run ffmpeg pipeline v3
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          python3 ffmpeg_pipeline_v3.py \
            "${{ github.event.inputs.repo }}" \
            "${{ github.event.inputs.stars }}" \
            "${{ github.event.inputs.description }}"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-v3
          path: projects/daily/renders/pipeline_v3_output.mp4
          retention-days: 7
