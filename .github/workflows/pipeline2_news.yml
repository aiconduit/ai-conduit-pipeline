name: AI Conduit パイプライン2 ニュース動画

on:
  schedule:
    - cron: '0 11 * * *'  # 毎日20:00 JST (UTC 11:00) ※視聴者が最も多い時間帯
  workflow_dispatch:

jobs:
  generate_news_video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          pip install requests edge-tts pillow google-cloud-texttospeech google-auth google-api-python-client google-auth-httplib2 google-auth-oauthlib google-cloud-texttospeech google-auth playwright moviepy numpy moviepy numpy pynacl
          python3 -m playwright install chromium
          python3 -m playwright install-deps chromium

      - name: SFX確認
        run: ls assets/sfx/ || echo "SFXディレクトリなし"

      - name: キャッシュクリア
        run: rm -rf assets/pexels_cache/playwright_kenburns_*.mp4 || true

      - name: Step 1 - ニュース収集
        run: python3 sns_automation/scripts/research_collector.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Step 2 - スクリプト生成（Fireship型）
        run: python3 sns_automation/scripts/news_content_planner.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Step 3 - 動画生成
        run: python3 run_from_news_plan.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Step 4 - YouTube投稿
        run: python3 sns_automation/scripts/youtube_auto_upload.py
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GIFT_LINK: ${{ secrets.GIFT_LINK }}

      - name: Step 4.2 - 動画連動プレゼント自動生成
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPELINE: p2
        run: |
          python3 sns_automation/scripts/gift_generator.py sns_automation/news_content_plan.json || echo "⚠️ プレゼント生成スキップ"
        continue-on-error: true

      - name: Step 4.5 - used_topics.json更新をコミット
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add sns_automation/used_topics.json || true
          git diff --staged --quiet || git commit -m "Auto: used_topics.json更新 [skip ci]"
          git push origin master || true
        continue-on-error: true

      - name: Step 5 - Instagram投稿
        run: |
          pip install instagrapi --quiet
          PIPELINE=p2 python3 sns_automation/scripts/instagram_auto_upload.py
        env:
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
        continue-on-error: true

      - name: Step 6 - X投稿（GraphQL方式）
        run: PIPELINE=p2 python3 sns_automation/scripts/x_graphql_post.py
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          X_TWID: ${{ secrets.X_TWID }}
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-video-${{ github.run_number }}
          path: projects/daily/renders/v2news_*.mp4
          retention-days: 3
