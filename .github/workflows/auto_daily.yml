name: AI Conduit 自動デイリーワーカー

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日06:00 JST
    - cron: '0 3 * * *'   # 毎日12:00 JST
    - cron: '0 9 * * *'   # 毎日18:00 JST
  workflow_dispatch:

jobs:
  auto_content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra -q
          pip install requests pillow numpy google-auth google-auth-oauthlib google-api-python-client edge-tts -q
      - name: Step1 GitHubトレンド収集
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          API_SEARCH_PAT: ${{ secrets.API_SEARCH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 sns_automation/scripts/trending_collector.py
      - name: Step2 コンテンツ計画生成
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 sns_automation/scripts/content_planner.py
      - name: Step3 動画生成
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 run_from_content_plan.py
      - name: Step4 pycaps字幕追加
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install pycaps faster-whisper -q
          python3 -c "
          import sys, os, glob
          sys.path.insert(0, 'sns_automation/scripts')
          from add_subtitles import add_word_focus_subtitles
          videos = sorted(glob.glob('projects/daily/renders/v1imp_*.mp4'))
          if videos:
              v = videos[-1]
              out = v.replace('v1imp_', 'sub_')
              add_word_focus_subtitles(v, out)
              print(f'✅ 字幕追加: {out}')
          else:
              print('⚠️ 動画ファイルなし')
          "
      - name: Step5 YouTube自動アップロード
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GIFT_LINK: ${{ secrets.GIFT_LINK }}
        run: python3 sns_automation/scripts/youtube_auto_upload.py
      - name: Step6 アナリティクス収集
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 sns_automation/scripts/analytics_collector.py
      - name: Step7 投稿キット生成
        continue-on-error: true
        run: python3 sns_automation/scripts/daily_post_kit.py
      - name: 動画アーティファクト保存
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_number }}
          path: |
            projects/daily/renders/*.mp4
            output/analytics_*.json
          retention-days: 7
