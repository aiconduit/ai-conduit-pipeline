name: AI Conduit 自動デイリーワーカー

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日06:00 JST
    - cron: '0 3 * * *'   # 毎日12:00 JST
    - cron: '0 9 * * *'   # 毎日18:00 JST
  workflow_dispatch:

jobs:
  auto_content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra -q
          pip install requests pillow numpy google-auth google-auth-oauthlib google-api-python-client -q
      - name: Run auto worker
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 sns_automation/scripts/trending_collector.py
          python3 sns_automation/scripts/content_planner.py
          python3 run_from_content_plan.py
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_number }}
          path: projects/daily/renders/*.mp4
          retention-days: 7
