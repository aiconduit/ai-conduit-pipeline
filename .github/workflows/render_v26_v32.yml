name: Render Video V26-V32

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline (v26_wyr/v27_chat/v28_stats/v29_whiteboard/v30_screenrec/v31_podcast/v32_wordsync)'
        required: true
        default: 'v26_wyr'
      repo:
        description: 'GitHub repo'
        required: false
        default: 'MadsLorentzen/ai-job-search'
      stars:
        description: 'Star count'
        required: false
        default: '17500'
      description:
        description: 'Description'
        required: false
        default: 'Claude Codeで就活を自動化するフレームワーク'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
      - name: Install Python deps
        run: pip install requests pillow numpy
      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          P="${{ github.event.inputs.pipeline }}"
          R="${{ github.event.inputs.repo }}"
          S="${{ github.event.inputs.stars }}"
          D="${{ github.event.inputs.description }}"
          case "$P" in
            v26_wyr)        python3 ffmpeg_pipeline_v26_wyr.py "$R" "$S" "$D" ;;
            v27_chat)       python3 ffmpeg_pipeline_v27_chat.py "$R" "$S" "$D" ;;
            v28_stats)      python3 ffmpeg_pipeline_v28_stats.py "$R" "$S" "$D" ;;
            v29_whiteboard) python3 ffmpeg_pipeline_v29_whiteboard.py "$R" "$S" "$D" ;;
            v30_screenrec)  python3 ffmpeg_pipeline_v30_screenrec.py "$R" "$S" "$D" ;;
            v31_podcast)    python3 ffmpeg_pipeline_v31_podcast.py "$R" "$S" "$D" ;;
            v32_wordsync)   python3 ffmpeg_pipeline_v32_wordsync.py "$R" "$S" "$D" ;;
          esac
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.event.inputs.pipeline }}
          path: projects/daily/renders/*.mp4
          retention-days: 7
