name: Post to Instagram
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "動画のartifact run ID"
        required: false
        default: "34564269960"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install instagrapi requests -q

      - name: Download video artifact
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RUN_ID="${{ github.event.inputs.artifact_run_id }}"
          echo "Downloading from run: $RUN_ID"
          gh run download $RUN_ID --dir ./video_artifact --repo aiconduit/ai-conduit-pipeline || true
          find ./video_artifact -name "*.mp4" | head -5
          VIDEO=$(find ./video_artifact -name "*.mp4" | head -1)
          if [ -z "$VIDEO" ]; then
            echo "❌ 動画が見つかりません"
            exit 1
          fi
          echo "VIDEO_PATH=$VIDEO" >> $GITHUB_ENV
          echo "動画: $VIDEO ($(du -h $VIDEO | cut -f1))"

      - name: Post to Instagram
        env:
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
        run: |
          python3 << 'PYEOF2'
          import os
          from instagrapi import Client

          sessionid = os.environ.get("INSTAGRAM_SESSIONID", "")
          video_path = os.environ.get("VIDEO_PATH", "")
          caption = "【無料】AIが自動でアーキテクチャ図を生成！Figma・Miro不要\nhttps://youtube.com/shorts/iaaY9lgRmK8\n#AI #AIツール #人工知能 #Reels"

          print(f"sessionid: {sessionid[:30]}...")
          print(f"動画: {video_path}")

          if not video_path or not os.path.exists(video_path):
              print(f"❌ 動画ファイルが見つかりません: {video_path}")
              exit(1)

          cl = Client()
          cl.delay_range = [1, 3]

          try:
              cl.login_by_sessionid(sessionid)
              print(f"✅ ログイン: {cl.username}")
              media = cl.clip_upload(video_path, caption)
              print(f"✅ 投稿成功: https://www.instagram.com/reel/{media.code}/")
          except Exception as e:
              print(f"❌ {type(e).__name__}: {str(e)[:300]}")
              exit(1)
          PYEOF2
