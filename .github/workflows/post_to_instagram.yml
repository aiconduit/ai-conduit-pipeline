name: Post to Instagram
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube Short URL"
        required: false
        default: "https://youtube.com/shorts/iaaY9lgRmK8"
      caption:
        description: "キャプション"
        required: false
        default: "【無料】AIが自動でアーキテクチャ図を生成！Figma・Miro不要"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install instagrapi requests -q

      - name: Download latest Short video
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # 最新のShort動画artifactを取得
          RUN_ID=$(gh run list --workflow=screen_record_kaggle.yml --status=success --limit=5 --json databaseId -q ".[0].databaseId" 2>/dev/null || echo "")
          if [ -n "$RUN_ID" ]; then
            gh run download $RUN_ID --dir ./video_artifact 2>/dev/null || true
          fi
          # artifactがなければarchify動画を使用
          VIDEO=$(find ./video_artifact -name "*.mp4" 2>/dev/null | head -1)
          if [ -z "$VIDEO" ]; then
            echo "⚠️ artifactなし、サンプル動画を使用"
            mkdir -p video_artifact
            # archify-launchの動画をダウンロード
            gh run download 34564269960 --dir ./video_artifact 2>/dev/null || true
            VIDEO=$(find ./video_artifact -name "*.mp4" 2>/dev/null | head -1)
          fi
          echo "VIDEO_PATH=$VIDEO" >> $GITHUB_ENV
          echo "動画: $VIDEO"
          ls -lh $VIDEO 2>/dev/null || echo "動画なし"

      - name: Post to Instagram
        env:
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
        run: |
          python3 << 'PYEOF'
          import os
          from instagrapi import Client

          sessionid = os.environ.get("INSTAGRAM_SESSIONID", "")
          video_path = os.environ.get("VIDEO_PATH", "")
          caption = """【無料】AIが自動でアーキテクチャ図を生成！Figma・Miro不要

https://youtube.com/shorts/iaaY9lgRmK8

#AI #AIツール #人工知能 #無料AIツール #Reels"""

          if not video_path or not os.path.exists(video_path):
              print(f"❌ 動画ファイルが見つかりません: {video_path}")
              exit(1)

          print(f"sessionid: {sessionid[:30]}...")
          print(f"動画: {video_path}")

          cl = Client()
          cl.delay_range = [1, 3]

          try:
              cl.login_by_sessionid(sessionid)
              print(f"✅ ログイン成功: {cl.username}")

              media = cl.clip_upload(video_path, caption)
              print(f"✅ Instagram投稿成功!")
              print(f"URL: https://www.instagram.com/reel/{media.code}/")
          except Exception as e:
              print(f"❌ エラー: {type(e).__name__}: {str(e)[:300]}")
              exit(1)
          'PYEOF'
