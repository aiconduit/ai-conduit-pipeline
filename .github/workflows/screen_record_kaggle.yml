name: Screen Record Kaggle
on:
  workflow_dispatch:
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test Kaggle auth first
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install requests -q
          python3 kaggle_push.py
      - name: Push screen recording to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          TARGET_URL: 'https://open-design.ai/html-anything/'
        run: |
          pip install requests -q
          python3 kaggle_screen_record.py
      - name: Wait and download from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kaggle requests -q
          python3 kaggle_wait_download.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-recording-${{ github.run_number }}
          path: screen_raw.mp4
          retention-days: 3
