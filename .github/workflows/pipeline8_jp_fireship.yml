name: AI Conduit Pipeline 8 JP Fireship

on:
  workflow_dispatch:
  schedule:
    # # - cron: '0 17 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install edge-tts requests google-auth-oauthlib google-api-python-client pillow --break-system-packages -q
          sudo apt-get install -y ffmpeg --quiet
      - name: Generate
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 sns_automation/scripts/p8_generate.py
      - name: Upload YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 sns_automation/scripts/yt_upload_simple.py || echo "upload skipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pipeline-8-JP-Fireship-video
          path: projects/daily/renders/
          retention-days: 3
