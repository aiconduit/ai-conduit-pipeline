name: Documentary Split Render
on:
  workflow_dispatch:

jobs:
  render-part1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: cd remotion-videos/documentary-30min && npm install
      - name: Install Chrome
        run: npx remotion browser ensure 2>/dev/null || true
        working-directory: remotion-videos/documentary-30min
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg --no-install-recommends -qq
      - name: Generate narration
        run: |
          sudo apt-get install -y ffmpeg --no-install-recommends -qq
          cd remotion-videos/documentary-30min
          pip install edge-tts --quiet 2>/dev/null
          python3 scripts/gen_narration.py
      - name: Render Part1
        run: |
          cd remotion-videos/documentary-30min
          npx remotion render src/indexPart1.tsx DocumentaryPart1 part1.mp4 --codec h264 --concurrency 4
          ls -lh part1.mp4
      - name: Upload Part1
        uses: actions/upload-artifact@v4
        with:
          name: documentary-part1
          path: remotion-videos/documentary-30min/part1.mp4
          retention-days: 1

  render-part2:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: cd remotion-videos/documentary-30min && npm install
      - name: Install Chrome
        run: npx remotion browser ensure 2>/dev/null || true
        working-directory: remotion-videos/documentary-30min
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg --no-install-recommends -qq
      - name: Generate narration
        run: |
          sudo apt-get install -y ffmpeg --no-install-recommends -qq
          cd remotion-videos/documentary-30min
          pip install edge-tts --quiet 2>/dev/null
          python3 scripts/gen_narration.py
      - name: Render Part2
        run: |
          cd remotion-videos/documentary-30min
          npx remotion render src/indexPart2.tsx DocumentaryPart2 part2.mp4 --codec h264 --concurrency 4
          ls -lh part2.mp4
      - name: Upload Part2
        uses: actions/upload-artifact@v4
        with:
          name: documentary-part2
          path: remotion-videos/documentary-30min/part2.mp4
          retention-days: 1

  render-part3:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: cd remotion-videos/documentary-30min && npm install
      - name: Install Chrome
        run: npx remotion browser ensure 2>/dev/null || true
        working-directory: remotion-videos/documentary-30min
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg --no-install-recommends -qq
      - name: Generate narration
        run: |
          sudo apt-get install -y ffmpeg --no-install-recommends -qq
          cd remotion-videos/documentary-30min
          pip install edge-tts --quiet 2>/dev/null
          python3 scripts/gen_narration.py
      - name: Render Part3
        run: |
          cd remotion-videos/documentary-30min
          npx remotion render src/indexPart3.tsx DocumentaryPart3 part3.mp4 --codec h264 --concurrency 4
          ls -lh part3.mp4
      - name: Upload Part3
        uses: actions/upload-artifact@v4
        with:
          name: documentary-part3
          path: remotion-videos/documentary-30min/part3.mp4
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [render-part1, render-part2, render-part3]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get install -y ffmpeg --no-install-recommends -qq
          pip install edge-tts --quiet 2>/dev/null
      - name: Download Part1
        uses: actions/download-artifact@v4
        with:
          name: documentary-part1
          path: ./parts
      - name: Download Part2
        uses: actions/download-artifact@v4
        with:
          name: documentary-part2
          path: ./parts
      - name: Download Part3
        uses: actions/download-artifact@v4
        with:
          name: documentary-part3
          path: ./parts
      - name: Generate narration audio
        run: |
          cd remotion-videos/documentary-30min
          python3 scripts/gen_narration.py
          ls -lh public/audio/
      - name: Merge video and add narration
        run: |
          ls -lh parts/
          # 動画を結合
          echo "file 'parts/part1.mp4'" > concat.txt
          echo "file 'parts/part2.mp4'" >> concat.txt
          echo "file 'parts/part3.mp4'" >> concat.txt
          ffmpeg -f concat -safe 0 -i concat.txt -c copy merged_video.mp4
          echo "動画結合完了: $(ffprobe -v quiet -show_entries format=duration -of csv=p=0 merged_video.mp4)秒"
          
          # 24シーン順にナレーションを結合
          AUDIO_DIR="remotion-videos/documentary-30min/public/audio"
          SCENE_ORDER="s01_hook s02_intro s03_origin_openai s04_chatgpt s05_anthropic_birth s06_split s07_safety_vs_growth s08_models_claude s09_models_gpt s10_benchmark s11_revenue_anthropic s12_revenue_compare s13_funding s14_ipo_race s15_enterprise s16_consumer s17_partners_ms s18_partners_aws s19_safety_constitutional s20_safety_rlhf s21_fbi s22_future_agi s23_stargate s24_conclusion"
          > /tmp/audio_concat.txt
          for scene in $SCENE_ORDER; do
            if [ -f "$AUDIO_DIR/${scene}.mp3" ]; then
              echo "file '$PWD/$AUDIO_DIR/${scene}.mp3'" >> /tmp/audio_concat.txt
              echo "  ✅ ${scene}.mp3"
            else
              echo "  ⚠️ ${scene}.mp3 not found"
            fi
          done
          cat /tmp/audio_concat.txt
          ffmpeg -f concat -safe 0 -i /tmp/audio_concat.txt -c copy /tmp/narration_full.mp3
          echo "ナレーション合計: $(ffprobe -v quiet -show_entries format=duration -of csv=p=0 /tmp/narration_full.mp3)秒"
          
          # 動画にナレーションをミックス
          ffmpeg -i merged_video.mp4 -i /tmp/narration_full.mp3             -c:v copy -c:a aac -b:a 128k             -map 0:v:0 -map 1:a:0             -shortest documentary_final.mp4
          ls -lh documentary_final.mp4
          ffprobe -v quiet -show_entries format=duration,bit_rate -of csv=p=0 documentary_final.mp4
      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: documentary-final-${{ github.run_number }}
          path: documentary_final.mp4
          retention-days: 7
