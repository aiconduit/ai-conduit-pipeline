name: DeepSeek Video Generator

on:
  push:
    branches: [ deepseek-pipeline ]
  workflow_dispatch:
    inputs:
      topic:
        description: '生成するトピック（例: n8n, ai-job-search）'
        required: false
        default: 'auto'
        type: string
  schedule:
    # # - cron: '0 0 * * *'
    # # - cron: '0 12 * * *'

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: deepseek-pipeline

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r deepseek/ds_requirements.txt

      - name: Run DeepSeek Pipeline
        run: |
          python deepseek/ds_pipeline.py --topic "${{ github.event.inputs.topic || 'auto' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-video
          path: deepseek/ds_output/*.mp4
          retention-days: 7

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-logs
          path: deepseek/ds_output/*.log
          retention-days: 3
