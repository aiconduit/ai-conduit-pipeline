name: DeepSeek 20 Patterns Video Generator

on:
  push:
    branches: [ master, deepseek-pipeline ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

jobs:
  generate-20-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pillow edge-tts requests

      - name: Generate 20 pattern videos
        run: |
          python3 deepseek/generate_20_patterns.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload all videos
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-20-patterns
          path: deepseek/ds_improved_output/pattern*.mp4
          retention-days: 7
