name: Remotion Video Render
on:
  workflow_dispatch:
    inputs:
      video_name:
        description: 'Video folder name under remotion-videos/'
        required: true
        default: 'anthropic-vs-openai-1min'
      upload:
        description: 'Upload to YouTube'
        required: false
        default: 'false'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd remotion-videos/${{ github.event.inputs.video_name }}
          npm install

      - name: Install Chrome for Remotion
        run: |
          sudo apt-get install -y chromium-browser --no-install-recommends -qq 2>/dev/null ||           sudo apt-get install -y chromium --no-install-recommends -qq 2>/dev/null || true
          cd remotion-videos/${{ github.event.inputs.video_name }}
          npx remotion browser ensure 2>/dev/null || true

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg --no-install-recommends -qq

      - name: Render video
        run: |
          cd remotion-videos/${{ github.event.inputs.video_name }}
          export PATH="$PWD/node_modules/.bin:$PATH"
          node node_modules/.bin/remotion render src/index.tsx Main output.mp4 \
            --codec h264 \
            --concurrency 1
          ls -lh output.mp4
          ffprobe -v quiet -show_entries format=duration -of csv=p=0 output.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-${{ github.event.inputs.video_name }}-${{ github.run_number }}
          path: remotion-videos/${{ github.event.inputs.video_name }}/output.mp4
          retention-days: 7
