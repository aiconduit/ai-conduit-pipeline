name: Stock Videos Generator
on:
  workflow_dispatch:
    inputs:
      sample_name:
        description: 'Sample name'
        required: true
        default: 'variables-launch'
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk git-lfs
          pip install edge-tts openai-whisper --quiet
      - name: Install HyperFrames
        run: npm install -g hyperframes --ignore-scripts
      - name: Clone sample with LFS
        run: |
          git lfs install
          git clone --depth=1 https://github.com/heygen-com/hyperframes-launches.git hf_launches
          cd hf_launches && git lfs pull
      - name: Generate TTS
        env:
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        run: |
          python3 -c "
          import asyncio, edge_tts, os
          narrations = {
            'variables-launch': 'HyperFramesのVariables機能を紹介します。1つのHTMLファイルで複数バージョンの動画を自動生成できます。Claude Codeと組み合わせれば全自動で作れます。コメントにAI Conduitと書いてソースコードを受け取ってください。',
            'spacex-launch': 'Claude CodeとHyperFramesを使ったシネマティック動画です。コードを書くだけでこのような動画が自動生成できます。コメントにAI Conduitと書いてソースコードを受け取ってください。',
            'cloud-render-launch': 'GitHub ActionsとHyperFramesを組み合わせた完全自動動画生成パイプラインです。毎日自動で動画を生成してYouTubeに投稿します。コメントにAI Conduitと書いてください。',
            'hyperframes-launch': 'HyperFramesとは何か徹底解説します。HTMLを書くだけでMP4動画が生成できる完全無料のフレームワークです。コメントにAI Conduitと書いてください。',
            'claude-paper-launch': 'Claude Paperを紹介します。AIの思考プロセスを可視化する機能です。コメントにAI Conduitと書いてソースコードを受け取ってください。',
            'figma-launch': 'FigmaのデザインデータをHyperFramesで動画化する方法を紹介します。コメントにAI Conduitと書いてください。',
            'timeline-launch': 'HyperFramesのTimeline機能で複雑なアニメーションを作れます。コメントにAI Conduitと書いてください。',
            'liquid-brand-refraction': 'HyperFramesのShader機能でリキッドエフェクトを作る方法です。コメントにAI Conduitと書いてください。',
            'pr-to-video-launch': 'Pull RequestをHyperFramesで自動動画化します。コメントにAI Conduitと書いてください。',
            'sfx-music-launch': 'HyperFramesで音楽と効果音付きの動画を作る方法です。コメントにAI Conduitと書いてください。',
            'texture-launch-video': 'HyperFramesのテクスチャエフェクトで映像に深みを出す方法です。コメントにAI Conduitと書いてください。',
            'vfx-heygen-combined': 'Three.jsとHyperFramesを組み合わせたVFXの作り方です。コメントにAI Conduitと書いてください。',
            'HF-heygen-stripe': 'StripeとHyperFramesを組み合わせた動画自動生成システムです。コメントにAI Conduitと書いてください。',
            'frame-md-launch-storyboard': 'MarkdownからHyperFramesで動画を自動生成します。コメントにAI Conduitと書いてください。',
            'website-to-hyperframes': 'ウェブサイトをHyperFramesで動画に変換する方法です。コメントにAI Conduitと書いてください。',
            'claude-design-send-hyperframes-launch': 'Claude DesignとHyperFramesでデザインをそのまま動画に変換します。コメントにAI Conduitと書いてください。',
          }
          name = os.environ.get('SAMPLE_NAME','variables-launch')
          text = narrations.get(name, 'HyperFramesサンプル動画です。コメントにAI Conduitと書いてください。')
          async def gen():
              c = edge_tts.Communicate(text, voice='ja-JP-KeitaNeural', rate='+8%')
              await c.save('narration.mp3')
          asyncio.run(gen())
          print('TTS完了:', os.path.getsize('narration.mp3')//1024, 'KB')
          "
      - name: Remove audio and render
        env:
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        shell: python3 {0}
        run: |
          import re, os, subprocess
          name = os.environ['SAMPLE_NAME']
          path = f'hf_launches/{name}'
          for root, dirs, files in os.walk(path):
              for f in files:
                  if f.endswith('.html'):
                      p = os.path.join(root, f)
                      h = open(p).read()
                      h = re.sub(r'<audio[^>]*>.*?</audio>', '', h, flags=re.DOTALL)
                      h = re.sub(r'<hf-audio[^>]*/>', '', h)
                      open(p, 'w').write(h)
          env = {**os.environ, 'HF_VIDEO_COVERAGE_THRESHOLD': '0'}
          r = subprocess.run(['hyperframes', 'render', path, '-o', 'silent.mp4'], env=env, timeout=600)
          print('render:', r.returncode, os.path.exists('silent.mp4'))
      - name: Generate subtitles with Whisper
        run: |
          python3 -m whisper narration.mp3 --language ja --output_format ass --output_dir . --model tiny 2>/dev/null || echo "whisper失敗"
          ls -la *.ass 2>/dev/null || echo "ASSファイルなし"
      - name: Merge video audio subtitles
        run: |
          if [ -f narration.ass ]; then
            ffmpeg -y -i silent.mp4 -i narration.mp3 \
              -vf "ass=narration.ass" \
              -c:v libx264 -c:a aac -shortest -pix_fmt yuv420p output.mp4
            echo "字幕付き完成"
          else
            ffmpeg -y -i silent.mp4 -i narration.mp3 \
              -c:v libx264 -c:a aac -shortest -pix_fmt yuv420p output.mp4
            echo "字幕なし完成"
          fi
          ls -lh output.mp4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-${{ github.event.inputs.sample_name }}-${{ github.run_number }}
          path: output.mp4
          retention-days: 7
