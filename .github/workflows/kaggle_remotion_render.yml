name: Kaggle Remotion Documentary Render
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests -q

      - name: Render on Kaggle GPU
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python kaggle_remotion_render.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: documentary-kaggle-${{ github.run_number }}
          path: documentary_output.mp4
          retention-days: 7
