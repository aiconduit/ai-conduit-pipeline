name: Longform Video Render
on:
  workflow_dispatch:
    inputs:
      video_name:
        description: 'Video folder name under longform/'
        required: true
        default: 'anthropic-vs-openai'
      upload:
        description: 'Upload to YouTube'
        required: true
        default: 'false'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg git-lfs fonts-noto-cjk --no-install-recommends -qq
          pip install edge-tts --quiet
          npm install -g hyperframes

      - name: Generate TTS for all sections
        env:
          VIDEO_NAME: ${{ github.event.inputs.video_name }}
        run: |
          python3 << 'PYEOF'
          import asyncio, edge_tts, json, subprocess, os
          
          script = json.load(open(f"longform/{os.environ['VIDEO_NAME']}/script.json"))
          
          async def gen_audio(text, path, rate="+15%"):
              c = edge_tts.Communicate(text, "ja-JP-KeitaNeural", rate=rate)
              await c.save(path)
          
          async def main():
              seg_paths = []
              for section in script['sections']:
                  sid = section['id']
                  chunks = section['narration']
                  rate = "+15%"
                  
                  # 各チャンクを生成
                  chunk_paths = []
                  for i, chunk in enumerate(chunks):
                      path = f"/tmp/{sid}_chunk{i:02d}.mp3"
                      await gen_audio(chunk, path, rate)
                      chunk_paths.append(path)
                      print(f"  {sid} chunk{i}: done")
                  
                  # セクションを結合
                  concat_file = f"/tmp/{sid}_concat.txt"
                  with open(concat_file, 'w') as f:
                      for p in chunk_paths:
                          f.write(f"file '{p}'\n")
                  
                  out_path = f"/tmp/{sid}.mp3"
                  subprocess.run(["ffmpeg", "-y", "-f", "concat", "-safe", "0",
                                 "-i", concat_file, "-c", "copy", out_path],
                                capture_output=True)
                  seg_paths.append(out_path)
                  
                  dur = float(subprocess.run(["ffprobe","-v","error","-show_entries",
                      "format=duration","-of","csv=p=0",out_path],
                      capture_output=True,text=True).stdout.strip())
                  print(f"Section {sid}: {dur:.1f}s")
              
              # 全セクションを結合
              concat_all = "/tmp/all_concat.txt"
              with open(concat_all, 'w') as f:
                  for p in seg_paths:
                      f.write(f"file '{p}'\n")
              
              subprocess.run(["ffmpeg", "-y", "-f", "concat", "-safe", "0",
                             "-i", concat_all, "-c", "copy", "narration_full.mp3"],
                            capture_output=True)
              
              total = float(subprocess.run(["ffprobe","-v","error","-show_entries",
                  "format=duration","-of","csv=p=0","narration_full.mp3"],
                  capture_output=True,text=True).stdout.strip())
              print(f"✅ 全ナレーション: {total:.1f}s ({total/60:.1f}分)")
          
          asyncio.run(main())
          PYEOF

      - name: Render with HyperFrames
        env:
          VIDEO_NAME: ${{ github.event.inputs.video_name }}
        run: |
          HF_VIDEO_COVERAGE_THRESHOLD=0 \
          PRODUCER_STREAMING_ENCODE_MAX_DURATION_SECONDS=2400 \
          hyperframes render longform/$VIDEO_NAME -o raw_video.mp4 --low-memory-mode
          ls -lh raw_video.mp4
          ffprobe -v quiet -show_entries format=duration -of csv=p=0 raw_video.mp4

      - name: Merge video and audio
        run: |
          # BGMミックス
          VIDEO_DUR=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 raw_video.mp4 | awk '{printf "%.0f", $1}')
          FADE_START=$((VIDEO_DUR - 5))
          
          if [ -f "assets/bgm_lofi.mp3" ]; then
            ffmpeg -y \
              -i raw_video.mp4 \
              -i narration_full.mp3 \
              -i assets/bgm_lofi.mp3 \
              -filter_complex "\
                [2:a]aloop=loop=-1:size=2000000,atrim=0:${VIDEO_DUR},afade=t=in:st=0:d=3,afade=t=out:st=${FADE_START}:d=5,volume=0.12[bgm];\
                [1:a][bgm]amix=inputs=2:duration=first[aout]" \
              -map 0:v -map "[aout]" \
              -c:v libx264 -c:a aac -b:a 192k -pix_fmt yuv420p \
              output.mp4
          else
            ffmpeg -y -i raw_video.mp4 -i narration_full.mp3 \
              -map 0:v -map 1:a \
              -c:v libx264 -c:a aac -b:a 192k -pix_fmt yuv420p \
              -shortest output.mp4
          fi
          ls -lh output.mp4
          ffprobe -v quiet -show_entries format=duration -of csv=p=0 output.mp4

      - name: Upload to YouTube
        if: github.event.inputs.upload == 'true'
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          VIDEO_NAME: ${{ github.event.inputs.video_name }}
        run: |
          pip install requests --quiet
          python3 << 'PYEOF'
          import requests, os, json
          
          # YouTube OAuth
          token_resp = requests.post("https://oauth2.googleapis.com/token", data={
              "client_id": os.environ["YOUTUBE_CLIENT_ID"],
              "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
              "grant_type": "refresh_token"
          })
          token = token_resp.json()["access_token"]
          
          video_name = os.environ["VIDEO_NAME"]
          titles = {
              "anthropic-vs-openai": "【完全版】AnthropicとOpenAI徹底比較｜AI最強2社の戦略・収益・哲学を33分で解説",
          }
          title = titles.get(video_name, "AI企業完全解説")
          
          # メタデータアップロード
          meta = {
              "snippet": {
                  "title": title,
                  "description": "AnthropicとOpenAI、2社のAI戦略を徹底比較。設立の歴史から最新の財務データ、モデル比較、安全性哲学まで完全解説。\n\n📌 チャプター\n00:00 イントロ\n02:00 OpenAIの誕生\n05:00 Anthropicの誕生\n08:00 決別の真相\n11:00 モデル比較\n14:00 収益比較\n17:00 資金調達\n19:00 ビジネスモデル\n22:00 安全性哲学\n25:00 パートナー戦略\n27:00 今後の展望\n30:00 まとめ\n\n#AI #Anthropic #OpenAI #Claude #ChatGPT #AI企業",
                  "tags": ["AI","Anthropic","OpenAI","Claude","ChatGPT","人工知能","AI比較"],
                  "categoryId": "28",
                  "defaultLanguage": "ja"
              },
              "status": {"privacyStatus": "public"}
          }
          
          init = requests.post(
              "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json",
                       "X-Upload-Content-Type": "video/mp4"},
              json=meta
          )
          upload_url = init.headers["Location"]
          
          with open("output.mp4", "rb") as f:
              data = f.read()
          
          resp = requests.put(upload_url,
              headers={"Authorization": f"Bearer {token}", "Content-Type": "video/mp4"},
              data=data)
          
          video_id = resp.json().get("id","")
          print(f"✅ YouTube投稿成功: https://youtube.com/watch?v={video_id}")
          PYEOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: longform-${{ github.event.inputs.video_name }}-${{ github.run_number }}
          path: output.mp4
          retention-days: 7
