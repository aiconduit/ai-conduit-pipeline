name: Upload Video
on:
  workflow_dispatch:
    inputs:
      sample_name:
        description: Sample name
        required: true
        default: codex-chatgpt-launch
      upload:
        description: 'Upload to YouTube (true/false)'
        required: false
        default: 'true'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get install -y ffmpeg git-lfs fonts-noto-cjk --no-install-recommends -qq
          pip install edge-tts --quiet
          npm install -g hyperframes --ignore-scripts
      - name: Clone sample
        run: |
          git lfs install
          git clone --depth=1 https://github.com/heygen-com/hyperframes-launches.git hf_launches
          CLONE_NAME="${{ github.event.inputs.sample_name }}"
          if [ -d "hf_original/$CLONE_NAME" ]; then
            echo "✅ hf_originalを使用: $CLONE_NAME"
          else
            cd hf_launches && git lfs pull --include="${CLONE_NAME}/**"
          fi
      - name: Render
        env:
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        run: |
          if [ -d "hf_original/$SAMPLE_NAME" ]; then
            HF_VIDEO_COVERAGE_THRESHOLD=0 hyperframes render hf_original/$SAMPLE_NAME -o raw.mp4
          else
            HF_VIDEO_COVERAGE_THRESHOLD=0 hyperframes render hf_launches/$SAMPLE_NAME -o raw.mp4
          fi
          ls -lh raw.mp4
      - name: Generate TTS and caption composition
        env:
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        run: |
          pip install edge-tts --quiet 2>/dev/null
          python3 scripts/gen_caption_composition.py "$SAMPLE_NAME" narration.mp3 captions.html narration.srt
          echo "✅ TTS完了"
      - name: Merge video audio character subtitles
        run: |
          python3 scripts/gen_subtitle_filter.py narration.srt narration.ass
          if ffmpeg -filters 2>&1 | grep -q "^.*ass"; then
            ffmpeg -y -i raw.mp4 -i test_render/character_main.png -i narration.mp3 \
              -filter_complex "[1:v]scale=iw*0.65:-1[char];[0:v][char]overlay=W-w-20:H-h-100[vchar];[vchar]ass=narration.ass[vout]" \
              -map "[vout]" -map "2:a" -c:v libx264 -c:a aac -pix_fmt yuv420p output.mp4
          else
            ffmpeg -y -i raw.mp4 -i test_render/character_main.png -i narration.mp3 \
              -filter_complex "[1:v]scale=iw*0.65:-1[char];[0:v][char]overlay=W-w-20:H-h-100[vchar]" \
              -map "[vchar]" -map "2:a" -c:v libx264 -c:a aac -pix_fmt yuv420p output.mp4
          fi
          ls -lh output.mp4
      - name: Upload to YouTube
        if: github.event.inputs.upload == 'true'
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        run: |
          pip install requests --quiet 2>/dev/null
          python3 << 'PYEOF'
import requests, os, json
sample_name = os.environ["SAMPLE_NAME"]
gift_url = "https://aiconduit.github.io/ai-conduit-pipeline/"
titles = {
    "codex-chatgpt-launch": "ChatGPTが考えてCodexが実行する最強AI開発環境 #Shorts",
    "html-anything-launch": "HTMLを書くだけで動画が作れるAIツール登場 #Shorts",
    "deepseek-harness-launch": "DeepSeek Harnessで全てをプラグイン化する方法 #Shorts",
    "anydoc-launch": "Word・PDF・ExcelをMarkdownに変換するRust製ツール #Shorts",
    "praxist-launch": "自律型AI研究システムPRAXISTの使い方 #Shorts",
    "openbot-launch": "OpenBotで専用PCを持つAIコワーカーを作る方法 #Shorts",
}
title = titles.get(sample_name, f"AI Conduit {sample_name} #Shorts")
description = f"""📌 動画の各シーンにパスワードが隠れています！
全シーンをスクショして、ClaudeやGPTに画像解析させてパスワードを見つけてください。

🎁 無料テンプレート配布ページ:
{gift_url}

パスワードを入力するとClaudeCodeテンプレートが無料で受け取れます！

✅ 役に立ったらいいね・保存をお願いします
💬 コメントに「AI Conduit」と書いてください

🔗 GitHub: https://github.com/aiconduit
#HyperFrames #ClaudeCode #AI自動化 #AIツール #Shorts"""
r = requests.post("https://oauth2.googleapis.com/token", data={
    "grant_type": "refresh_token",
    "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
    "client_id": os.environ["YOUTUBE_CLIENT_ID"],
    "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
})
token = r.json().get("access_token", "")
if not token:
    print(f"トークン取得失敗: {r.text}")
    exit(1)
metadata = {
    "snippet": {"title": title[:100], "description": description, "tags": ["HyperFrames","ClaudeCode","AI自動化","Shorts"], "categoryId": "28", "defaultLanguage": "ja"},
    "status": {"privacyStatus": "public", "selfDeclaredMadeForKids": False}
}
headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
r2 = requests.post(
    "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status",
    headers=headers, json=metadata
)
upload_url = r2.headers.get("Location", "")
if not upload_url:
    print(f"Upload URL取得失敗: {r2.text}")
    exit(1)
with open("output.mp4", "rb") as f:
    video_data = f.read()
r3 = requests.put(upload_url, data=video_data, headers={"Content-Type": "video/mp4"})
video_id = r3.json().get("id", "")
print(f"✅ YouTube投稿成功: https://youtube.com/shorts/{video_id}")
PYEOF
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-video-${{ github.run_number }}
          path: output.mp4
          retention-days: 3
