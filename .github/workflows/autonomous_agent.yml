name: AI Conduit 完全量産システム

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

jobs:
  full_pipeline:
    name: 172ステップ完全パイプライン
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 依存関係インストール
        run: |
          pip install edge-tts gtts requests aiofiles asciinema asciinema-automation Pillow numpy faster-whisper google-auth google-auth-oauthlib google-api-python-client -q
          curl -sL https://github.com/asciinema/agg/releases/latest/download/agg-x86_64-unknown-linux-gnu -o /usr/local/bin/agg
          chmod +x /usr/local/bin/agg
          sudo apt-get install -y ffmpeg fonts-noto-cjk -q 2>/dev/null
          echo "✅ 依存関係完了"

      - name: 完全パイプライン実行
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          GIFT_LINK: ${{ secrets.GIFT_LINK }}
        run: |
          cd sns_automation/scripts
          python3 master_pipeline.py

      - name: 結果確認
        run: |
          echo "=== 投稿結果 ==="
          cat /tmp/uploaded_video_id.txt 2>/dev/null || echo "動画IDなし"
          echo "=== ログ ==="
          ls logs/ 2>/dev/null | tail -5

      - name: ログをコミット
        run: |
          git config user.email "agent@aiconduit.com"
          git config user.name "AI Conduit Agent"
          git add logs/ || true
          git diff --staged --quiet || git commit -m "Auto: パイプライン実行ログ $(date +%Y%m%d_%H%M)"
          git push || true

  auto_private_check:
    name: 自動非公開チェック
    needs: full_pipeline
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 非公開チェック
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          pip install requests -q
          python3 sns_automation/scripts/auto_private.py || true
          python3 sns_automation/scripts/auto_comment_reply.py || true
