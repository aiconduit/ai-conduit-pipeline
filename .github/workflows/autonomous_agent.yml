name: AI Conduit 自律型エージェント

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

jobs:
  stage1_script:
    name: 台本生成
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      score: ${{ steps.check.outputs.score }}
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - uses: actions/checkout@v4

      - name: 台本生成
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          pip install requests -q
          python3 sns_automation/scripts/generate_script.py

      - name: 品質チェック
        id: check
        run: python3 sns_automation/scripts/quality_check.py

      - uses: actions/upload-artifact@v4
        with:
          name: script
          path: news_content_plan.json

  stage2_video:
    name: 動画生成
    needs: stage1_script
    if: needs.stage1_script.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: script
      - name: 動画生成
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          pip install edge-tts requests aiofiles asciinema asciinema-automation -q
          curl -sL https://github.com/asciinema/agg/releases/latest/download/agg-x86_64-unknown-linux-gnu -o /usr/local/bin/agg
          chmod +x /usr/local/bin/agg
          sudo apt-get install -y ffmpeg fonts-noto-cjk -q 2>/dev/null
          python3 run_from_news_plan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: output_video.mp4

  stage3_upload:
    name: YouTube投稿
    needs: stage2_video
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      video_id: ${{ steps.upload.outputs.video_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: video
      - uses: actions/download-artifact@v4
        with:
          name: script
      - name: YouTube投稿
        id: upload
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          pip install google-auth google-auth-oauthlib google-api-python-client requests -q
          python3 sns_automation/scripts/youtube_auto_upload.py
          VID=$(cat /tmp/uploaded_video_id.txt 2>/dev/null || echo "")
          echo "video_id=$VID" >> $GITHUB_OUTPUT

  stage4_log:
    name: 記録
    needs: [stage1_script, stage3_upload]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 結果記録
        run: |
          mkdir -p logs
          echo '{"video_id":"${{ needs.stage3_upload.outputs.video_id }}","score":"${{ needs.stage1_script.outputs.score }}","posted_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > logs/latest_video.json
          git config user.email "agent@aiconduit.com"
          git config user.name "AI Conduit Agent"
          git add logs/ || true
          git diff --staged --quiet || git commit -m "Auto: 記録 $(date +%Y%m%d_%H%M)"
          git push || true
