name: Modal + Lightning AI テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Modal.com API テスト
        run: |
          pip install modal -q 2>/dev/null || true
          python3 << 'PYEOF'
          import requests
          
          # Modal APIエンドポイント確認
          r = requests.get("https://api.modal.com/v1/", timeout=5)
          print(f"Modal API: {r.status_code} {r.text[:100]}")
          
          # Modal サインアップURL
          print("Modal登録: https://modal.com/signup")
          print("特徴: 月$30分の無料クレジット・GPU A10G・カード不要")
          PYEOF

      - name: Lightning AI API テスト
        run: |
          python3 << 'PYEOF'
          import requests
          
          # Lightning AI APIを確認
          r = requests.get("https://lightning.ai/api/v1/", timeout=5)
          print(f"Lightning AI: {r.status_code} {r.text[:100]}")
          
          # Salad Cloud（安価GPU）
          r2 = requests.get("https://api.salad.com/api/public/", timeout=5)
          print(f"Salad Cloud: {r2.status_code} {r2.text[:100]}")
          
          # Vast.ai
          r3 = requests.get("https://console.vast.ai/api/v0/", timeout=5)
          print(f"Vast.ai: {r3.status_code} {r3.text[:100]}")
          PYEOF

      - name: Replicate API テスト（Wan2.2）
        run: |
          python3 << 'PYEOF'
          import requests
          
          # Replicateの無料モデル確認
          r = requests.get("https://api.replicate.com/v1/models/wan-video/wan-2.1", timeout=10)
          print(f"Replicate Wan: {r.status_code} {r.text[:200]}")
          
          # 無料で使えるモデル
          r2 = requests.get("https://api.replicate.com/v1/models?cursor=&per_page=5", timeout=10)
          print(f"Models: {r2.status_code}")
          PYEOF
