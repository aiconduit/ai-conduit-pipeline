name: CogVideoX 実際の動画生成テスト

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: CogVideoX で動画生成（7シーン分）
        run: |
          pip install gradio_client requests -q
          python3 << 'PYEOF'
          from gradio_client import Client, handle_file
          import requests, os, shutil, time
          
          client = Client("THUDM/CogVideoX-5B-Space")
          
          # AI Conduitのシーン別プロンプト
          scenes = [
              ("hook",     "frustrated developer staring at dark terminal screen, close up face, cinematic"),
              ("why",      "developer typing frantically at computer with error messages on screen, dark office"),
              ("solution", "developer suddenly smiling at computer screen showing success, bright terminal"),
              ("step1",    "close up hands typing commands on dark mechanical keyboard, terminal screen"),
              ("step2",    "code editor screen showing YAML configuration file, syntax highlighting, dark theme"),
              ("result",   "developer celebrating at desk, multiple monitors, successful code deployment"),
              ("cta",      "smartphone screen showing download notification, modern app interface, close up"),
          ]
          
          os.makedirs("assets/cogvideo", exist_ok=True)
          
          for scene_name, prompt in scenes:
              print(f"\n生成中: {scene_name}")
              print(f"  プロンプト: {prompt[:60]}")
              try:
                  result = client.predict(
                      prompt=prompt,
                      image_input=None,
                      video_input=None,
                      video_strength=0.8,
                      seed_value=-1,
                      scale_status=False,
                      rife_status=False,
                      api_name="/generate"
                  )
                  print(f"  結果: {result}")
                  # 動画ファイルをコピー
                  if result and isinstance(result, (list, tuple)) and result[0]:
                      video_data = result[0]
                      if isinstance(video_data, dict):
                          src = video_data.get('video', '')
                      else:
                          src = str(video_data)
                      if src and os.path.exists(src):
                          dst = f"assets/cogvideo/{scene_name}.mp4"
                          shutil.copy(src, dst)
                          size = os.path.getsize(dst) // 1024
                          print(f"  ✅ 保存: {dst} ({size}KB)")
                      else:
                          print(f"  ⚠️ ファイルパス不明: {src}")
              except Exception as e:
                  print(f"  ❌ エラー: {e}")
              time.sleep(5)
          
          # 生成結果確認
          files = os.listdir("assets/cogvideo") if os.path.exists("assets/cogvideo") else []
          print(f"\n生成ファイル数: {len(files)}")
          for f in files:
              size = os.path.getsize(f"assets/cogvideo/{f}") // 1024
              print(f"  {f}: {size}KB")
          PYEOF

      - name: 生成動画をGitHubにコミット
        run: |
          git config user.email "cogvideo@aiconduit.com"
          git config user.name "CogVideo Generator"
          git add assets/cogvideo/ || true
          git diff --staged --quiet || git commit -m "Auto: CogVideoX シーン別動画生成"
          git push || true
