name: 無料動画生成 代替手段テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: HuggingFace 軽量動画モデルテスト
        run: |
          pip install gradio_client requests -q
          python3 << 'PYEOF'
          from gradio_client import Client
          import time

          # 軽量なモデルを複数試す
          spaces = [
              ("stabilityai/stable-video-diffusion", "/video"),
              ("multimodalart/stable-video-diffusion", "/predict"),
              ("damo-vilab/text-to-video-ms-1.7b", "/predict"),
              ("fffiloni/text-to-video", "/infer"),
              ("wangfuyun/AnimateLCM", "/animate"),
          ]
          
          for space_id, api_name in spaces:
              try:
                  print(f"\n試行: {space_id}")
                  client = Client(space_id, verbose=False)
                  print(f"  ✅ 接続成功")
                  # API一覧確認のみ（実際の生成はしない）
                  client.view_api()
              except Exception as e:
                  print(f"  ❌ {str(e)[:80]}")
              time.sleep(2)
          PYEOF

      - name: Zeroscope V2 テスト（軽量テキスト→動画）
        run: |
          pip install gradio_client -q
          python3 << 'PYEOF'
          from gradio_client import Client
          import time, os, shutil

          spaces = [
              "hysts/zeroscope-v2",
              "fffiloni/zeroscope-v2-XL",
              "Manjushri/Zeroscope-v2-XL",
          ]
          
          for space_id in spaces:
              try:
                  print(f"\n試行: {space_id}")
                  client = Client(space_id, verbose=False)
                  print(f"  ✅ 接続成功")
                  result = client.predict(
                      "developer coding dark terminal screen",
                      api_name="/predict"
                  )
                  print(f"  結果: {result}")
                  break
              except Exception as e:
                  print(f"  ❌ {str(e)[:100]}")
              time.sleep(3)
          PYEOF

      - name: Pexels 動画 新APIキーでテスト
        run: |
          python3 << 'PYEOF'
          import requests
          
          # Pexels Videos API
          key = "LSsE8rcX23VNaFN0M0F19PCMtoLhEyg1NxZpIqwr7aCuvUYInctIexrW"
          headers = {"Authorization": key}
          
          queries = ["developer coding dark", "typing keyboard terminal", "programmer computer night"]
          
          for q in queries:
              r = requests.get(
                  "https://api.pexels.com/videos/search",
                  headers=headers,
                  params={"query": q, "per_page": 3, "orientation": "portrait", "size": "medium"}
              )
              print(f"\n{q}: {r.status_code}")
              if r.status_code == 200:
                  for v in r.json().get('videos', [])[:2]:
                      for f in v.get('video_files', []):
                          if f.get('quality') == 'hd' and f.get('width', 0) <= 1080:
                              print(f"  ✅ {f['link'][:80]}")
                              break
          PYEOF
