name: ZeroGPU A14B 動画生成テスト

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ZeroGPU Wan2.2 動画生成
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install gradio_client huggingface_hub -q
          python3 << 'PYEOF'
          import os, shutil
          from gradio_client import Client

          HF_TOKEN = os.environ["HF_TOKEN"]

          # alexnasa/Wan2.2-Animate-ZEROGPU - zero-a10g RUNNING
          space_id = "alexnasa/Wan2.2-Animate-ZEROGPU"
          print(f"接続: {space_id}")
          
          try:
              client = Client(space_id, token=HF_TOKEN, verbose=False)
              client.view_api()
              print("✅ API接続成功")
              
              # 動画生成テスト（hook シーン）
              print("\n動画生成中: hook シーン")
              result = client.predict(
                  prompt="frustrated developer staring at dark terminal screen, cinematic 4K, professional",
                  api_name="/generate"
              )
              print(f"結果: {result}")
              
              # ファイル保存
              if result:
                  import shutil
                  os.makedirs("assets/zerogpu_videos", exist_ok=True)
                  if isinstance(result, str) and os.path.exists(result):
                      shutil.copy(result, "assets/zerogpu_videos/hook.mp4")
                      size = os.path.getsize("assets/zerogpu_videos/hook.mp4") // 1024
                      print(f"✅ 保存: assets/zerogpu_videos/hook.mp4 ({size}KB)")
          except Exception as e:
              print(f"❌ エラー: {e}")
          PYEOF
      - name: 生成動画コミット
        run: |
          git config user.email "zerogpu@aiconduit.com"
          git config user.name "ZeroGPU Generator"
          git add -f assets/zerogpu_videos/ || true
          git diff --staged --quiet || git commit -m "Auto: ZeroGPU A14B 動画生成"
          git push || true
