name: Wan2.2 A14B Space調査

on:
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: A14B Space動作確認
        run: |
          pip install gradio_client requests -q
          python3 << 'PYEOF'
          import requests
          from gradio_client import Client

          spaces = [
              "aryansrk/Wan-AI-Wan2.2-T2V-A14B",
              "rahul7star/Wan2.2-T2V-A14B",
              "wana14/Wan2.2-T2V-A14B",
              "tsh7676/Wan-AI-Wan2.2-T2V-A14B",
              "gageyoy/Wan-AI-Wan2.2-T2V-A14B",
          ]
          
          for space_id in spaces:
              print(f"\n=== {space_id} ===")
              # HF API確認
              r = requests.get(f"https://huggingface.co/api/spaces/{space_id}", timeout=10)
              if r.status_code == 200:
                  d = r.json()
                  runtime = d.get("runtime", {})
                  print(f"  Hardware: {runtime.get('hardware','?')}")
                  print(f"  Stage: {runtime.get('stage','?')}")
                  print(f"  SDK: {d.get('sdk','?')}")
              
              # Gradio API接続テスト
              try:
                  client = Client(space_id, verbose=False)
                  client.view_api()
                  print(f"  ✅ Gradio API接続成功")
              except Exception as e:
                  print(f"  ❌ {str(e)[:80]}")
          PYEOF
