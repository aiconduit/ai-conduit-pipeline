name: ZeroGPU A14B 直接テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ZeroGPU Space直接テスト
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install gradio_client requests -q
          python3 << 'PYEOF'
          import os, requests
          from gradio_client import Client

          HF_TOKEN = os.environ["HF_TOKEN"]
          headers = {"Authorization": f"Bearer {HF_TOKEN}"}

          # ZeroGPU関連Spaceを優先的にテスト
          priority_spaces = [
              "powolnik/Wan-AI-Wan2.2-T2V-A14B-ZERO",
              "mokodana/Wan-AI-Wan2.2-T2V-A14B-Unlimited",
              "alexnasa/Wan2.2-Animate-ZEROGPU",
              "wavespeed/wan2.2",
          ]

          for space_id in priority_spaces:
              print(f"\n=== {space_id} ===")
              # ランタイム確認
              r = requests.get(f"https://huggingface.co/api/spaces/{space_id}",
                             headers=headers, timeout=10)
              if r.status_code == 200:
                  d = r.json()
                  hw = d.get("runtime", {}).get("hardware", {})
                  stage = d.get("runtime", {}).get("stage", "")
                  print(f"  Hardware: {hw}")
                  print(f"  Stage: {stage}")
                  print(f"  SDK: {d.get('sdk','')}")
              
              # Gradio API接続
              try:
                  client = Client(space_id, hf_token=HF_TOKEN, verbose=False)
                  client.view_api()
                  print(f"  ✅ API接続成功！動画生成可能")
              except Exception as e:
                  print(f"  ❌ {str(e)[:120]}")
          PYEOF
