name: Claude画面録画テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 環境セットアップ
        run: |
          sudo apt-get install -y ffmpeg xvfb x11-utils -q 2>/dev/null
          pip install playwright requests -q
          python3 -m playwright install chromium
          python3 -m playwright install-deps chromium
          echo "✅ セットアップ完了"

      - name: Xvfb起動
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2
          echo "✅ Xvfb起動完了"

      - name: Claude画面録画テスト
        env:
          CLAUDE_SESSION_COOKIE: ${{ secrets.CLAUDE_SESSION_COOKIE }}
          DISPLAY: :99
        run: |
          pip install requests -q
          mkdir -p assets/claude_recordings
          python3 << 'PYEOF'
          import sys, os
          sys.path.insert(0, "sns_automation/scripts")
          from claude_screen_recorder import generate_claude_recording

          cookie = os.environ.get("CLAUDE_SESSION_COOKIE", "")
          
          tests = [
              ("step1", "手順1: .claude/agents/reviewer.mdの1行目にname: reviewer と書きます", 8.0),
              ("step2", "手順2: frontmatterにdisallowedTools: Write, Edit と記述します", 8.0),
          ]
          
          for scene, narration, dur in tests:
              out = f"assets/claude_recordings/{scene}.mp4"
              result = generate_claude_recording(scene, narration, dur, out, cookie)
              print(f"{scene}: {'✅' if result else '❌'}")
          PYEOF

      - name: コミット
        run: |
          git config user.email "claude@aiconduit.com"
          git config user.name "Claude Recorder"
          git add -f assets/claude_recordings/*.mp4 || true
          git diff --staged --quiet || git commit -m "Test: Claude画面録画"
          git push || true
