name: CogVideoX API調査

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: CogVideoX 正しいAPI名を調査
        run: |
          pip install gradio_client -q
          python3 << 'PYEOF'
          from gradio_client import Client
          client = Client("THUDM/CogVideoX-5B-Space")
          print("利用可能なAPI一覧:")
          for ep in client.view_api(print_info=False).get('named_endpoints', {}).items():
              print(f"  {ep}")
          PYEOF

      - name: CogVideoX 動画生成テスト
        run: |
          pip install gradio_client -q
          python3 << 'PYEOF'
          from gradio_client import Client
          import json
          client = Client("THUDM/CogVideoX-5B-Space")
          info = client.view_api(print_info=False)
          print(json.dumps(info, indent=2, ensure_ascii=False)[:2000])
          PYEOF

      - name: Pixabay 新しいAPIキーでテスト
        run: |
          echo "=== Pixabay動画API ==="
          curl -v "https://pixabay.com/api/videos/?key=49003380-2c63d1e3e86c19e1bf15ab4f1&q=coding+developer&per_page=3" 2>&1 | grep -E "HTTP|total|url" | head -10
