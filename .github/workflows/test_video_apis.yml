name: ZeroGPU T2V A14B 検索

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ZeroGPU T2V Space検索・API確認
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install gradio_client requests -q
          python3 << 'PYEOF'
          import os, requests
          from gradio_client import Client

          HF_TOKEN = os.environ["HF_TOKEN"]
          headers = {"Authorization": f"Bearer {HF_TOKEN}"}

          # より広い範囲でZeroGPU対応Spacesを検索
          searches = [
              "Wan2.2 text to video zero",
              "Wan2.2 T2V ZeroGPU",
              "wan video generation zerogpu",
          ]
          
          running_spaces = []
          for query in searches:
              r = requests.get("https://huggingface.co/api/spaces",
                              params={"search": query, "limit": 10},
                              headers=headers, timeout=10)
              if r.status_code == 200:
                  for s in r.json():
                      hw = s.get("runtime", {}).get("hardware", {})
                      stage = s.get("runtime", {}).get("stage", "")
                      current = hw.get("current", "") if isinstance(hw, dict) else ""
                      if stage == "RUNNING" and s.get("id") not in [x["id"] for x in running_spaces]:
                          running_spaces.append({"id": s.get("id"), "hw": current, "stage": stage})
                          print(f"✅ RUNNING: {s.get('id')} [{current}]")
          
          print(f"\n稼働中Space: {len(running_spaces)}件")
          
          # 各Spaceのテキスト→動画APIを確認
          for space in running_spaces[:5]:
              space_id = space["id"]
              print(f"\n=== {space_id} ===")
              try:
                  client = Client(space_id, token=HF_TOKEN, verbose=False)
                  info = client.view_api(print_info=False)
                  # promptパラメータがあるか確認
                  endpoints = str(info)
                  if "prompt" in endpoints.lower():
                      print(f"  ✅ テキスト入力あり！動画生成可能")
                      client.view_api()
                  else:
                      print(f"  ⚠️ promptなし: {endpoints[:100]}")
              except Exception as e:
                  print(f"  ❌ {str(e)[:100]}")
          PYEOF
