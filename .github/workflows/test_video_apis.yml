name: ZeroGPU A14B 動画生成

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wan2.2 A14B ZeroGPU 7シーン生成
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install gradio_client -q
          python3 << 'PYEOF'
          import os, shutil, time
          from gradio_client import Client

          HF_TOKEN = os.environ["HF_TOKEN"]
          space_id = "jimmie11/wan22-a14b-video"

          print(f"接続: {space_id}")
          client = Client(space_id, token=HF_TOKEN, verbose=False)
          client.view_api()
          print("✅ API接続成功")

          scenes = [
              ("hook",     "frustrated developer staring at dark terminal screen, cinematic 4K, professional, sharp focus, no text"),
              ("why",      "developer with stressed expression looking at computer error messages, dark office at night, cinematic"),
              ("solution", "developer smiling at terminal screen showing successful code output, bright green text, cinematic 4K"),
              ("step1",    "extreme close up of hands typing on mechanical keyboard, green terminal glow, dark background, 4K"),
              ("step2",    "code editor screen showing YAML configuration file with syntax highlighting, dark theme, cinematic"),
              ("result",   "developer celebrating success at desk with multiple monitors showing green output, achievement, 4K"),
              ("cta",      "smartphone held in hand showing app notification close up, modern UI, dark background, cinematic"),
          ]

          os.makedirs("assets/zerogpu_hq", exist_ok=True)

          for scene_name, prompt in scenes:
              print(f"\n=== {scene_name} ===")
              print(f"プロンプト: {prompt[:60]}")
              try:
                  result = client.predict(
                      prompt=prompt,
                      negative_prompt="blurry, low quality, watermark, text overlay, bad anatomy, ugly, distorted",
                      steps=40,
                      guidance=7.0,
                      api_name="/predict"
                  )
                  if result and os.path.exists(str(result)):
                      dst = f"assets/zerogpu_hq/{scene_name}.mp4"
                      shutil.copy(str(result), dst)
                      size = os.path.getsize(dst) // 1024
                      print(f"✅ {dst} ({size}KB)")
                  else:
                      print(f"❌ 結果なし: {result}")
              except Exception as e:
                  print(f"❌ {scene_name}: {e}")
              time.sleep(3)

          files = os.listdir("assets/zerogpu_hq")
          print(f"\n生成完了: {len([f for f in files if f.endswith('.mp4')])}/7シーン")
          PYEOF

      - name: 生成動画をコミット
        run: |
          git config user.email "zerogpu@aiconduit.com"
          git config user.name "ZeroGPU A14B"
          git add -f assets/zerogpu_hq/ || true
          git diff --staged --quiet || git commit -m "Auto: Wan2.2 A14B ZeroGPU 7シーン動画生成"
          git push || true
