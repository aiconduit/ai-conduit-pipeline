name: OmniRoute テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: OmniRoute 無料モデルテスト
        run: |
          pip install requests -q
          python3 << 'PYEOF'
          import requests, json
          
          # OmniRoute GitHubを確認
          r = requests.get("https://raw.githubusercontent.com/diegosouzapw/OmniRoute/main/README.md", timeout=10)
          print(r.text[:2000])
          PYEOF

      - name: OpenRouter 無料モデルで台本生成テスト
        run: |
          pip install requests -q
          python3 << 'PYEOF'
          import requests, json
          
          # OpenRouter APIキーなしで試す
          headers = {
              "Content-Type": "application/json",
              "HTTP-Referer": "https://aiconduit.com",
              "X-Title": "AI Conduit",
          }
          
          # 無料モデル一覧取得
          r = requests.get("https://openrouter.ai/api/v1/models", headers=headers, timeout=10)
          print(f"Models API: {r.status_code}")
          if r.status_code == 200:
              models = r.json().get("data", [])
              free = [m for m in models if ":free" in m.get("id","")]
              print(f"無料モデル数: {len(free)}")
              for m in free[:15]:
                  ctx = m.get("context_length", 0)
                  print(f"  {m['id']} (ctx:{ctx:,})")
          PYEOF
