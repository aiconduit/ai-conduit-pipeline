name: ターミナル録画テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: asciinema + agg + asciinema-automation インストール
        run: |
          pip install asciinema asciinema-automation -q
          curl -sL https://github.com/asciinema/agg/releases/latest/download/agg-x86_64-unknown-linux-gnu -o /usr/local/bin/agg
          chmod +x /usr/local/bin/agg
          sudo apt-get install -y ffmpeg -q 2>/dev/null
          echo "✅ インストール完了"

      - name: ターミナル録画テスト
        run: |
          pip install requests -q
          python3 << 'PYEOF'
          import sys
          sys.path.insert(0, "sns_automation/scripts")
          from terminal_recorder import generate_scene_video
          import os
          os.makedirs("assets/terminal_test", exist_ok=True)
          
          tests = [
              ("step1", "手順1: .claude/agents/reviewer.mdの1行目にname: reviewer と書きます", 5.0),
              ("step2", "手順2: frontmatterにdisallowedTools: Write, Edit と記述します", 5.0),
              ("solution", "Claude Codeのサブエージェント設定・.claude/agents/reviewer.mdで解決", 4.0),
          ]
          for scene, narration, dur in tests:
              out = f"assets/terminal_test/{scene}.mp4"
              result = generate_scene_video(scene, narration, dur, out)
              print(f"{scene}: {'✅' if result else '❌'}")
          PYEOF

      - name: コミット
        run: |
          git config user.email "terminal@aiconduit.com"
          git config user.name "Terminal Recorder"
          git add -f assets/terminal_test/*.mp4 || true
          git diff --staged --quiet || git commit -m "Test: ターミナル録画MP4"
          git push || true
