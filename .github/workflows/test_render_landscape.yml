name: Test Render Landscape to Vertical
on:
  workflow_dispatch:
    inputs:
      sample_name:
        description: Sample name (landscape 1920x1080)
        required: true
        default: variables-launch
      upload:
        description: 'Upload to YouTube (true/false)'
        required: false
        default: 'false'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get install -y ffmpeg git-lfs fonts-noto-cjk --no-install-recommends -qq
          pip install edge-tts --quiet
          npm install -g hyperframes --ignore-scripts
      - name: Clone sample
        run: |
          git lfs install
          git clone --depth=1 https://github.com/heygen-com/hyperframes-launches.git hf_launches
          cd hf_launches && git lfs pull --include="${{ github.event.inputs.sample_name }}/**"
      - name: Convert to vertical (scale into top half)
        env:
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        shell: python3 {0}
        run: |
          import re, os, shutil
          name = os.environ["SAMPLE_NAME"]
          src = f"hf_launches/{name}"
          out = name  # そのままrenderに使う

          orig_w, orig_h = 1920, 1080
          canvas_w, canvas_h = 1080, 1920
          # 上半分(960px)にコンテンツを収めるscale
          target_h = 960
          scale = target_h / orig_h       # 0.8889
          scaled_w = int(orig_w * scale)  # 960px
          left_pad = int((canvas_w - scaled_w) / 2)  # 60px

          shutil.copytree(src, out, dirs_exist_ok=True)

          inject_css = f"""<style>
          html, body {{
            width: {canvas_w}px !important;
            height: {canvas_h}px !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #000 !important;
            overflow: hidden !important;
          }}
          .hf-content-scaler {{
            position: absolute !important;
            top: 0 !important;
            left: {left_pad}px !important;
            transform: scale({scale:.4f}) !important;
            transform-origin: top left !important;
            width: {orig_w}px !important;
            height: {orig_h}px !important;
          }}
          </style>"""

          def patch_html(path, is_index=False):
              h = open(path).read()
              h = re.sub(r"<audio[^>]*>.*?</audio>", "", h, flags=re.DOTALL)
              h = re.sub(r"<hf-audio[^>]*/?>", "", h)
              h = re.sub(r'<meta name="viewport"[^>]*>',
                         f'<meta name="viewport" content="width={canvas_w}, height={canvas_h}" />', h)
              h = h.replace(f'data-width="{orig_w}"', f'data-width="{canvas_w}"')
              h = h.replace(f'data-height="{orig_h}"', f'data-height="{canvas_h}"')
              if is_index:
                  # body直下の要素をdivでラップしてscale適用
                  h = re.sub(
                      r"(<body[^>]*>)(.*?)(</body>)",
                      lambda m: m.group(1) +
                        f'<div class="hf-content-scaler">' + m.group(2) + '</div>' +
                        m.group(3),
                      h, flags=re.DOTALL
                  )
              h = h.replace("</head>", inject_css + "</head>")
              open(path, "w").write(h)

          # compositions
          comp_dir = f"{out}/compositions"
          if os.path.exists(comp_dir):
              for f in sorted(os.listdir(comp_dir)):
                  if f.endswith(".html"):
                      patch_html(f"{comp_dir}/{f}", is_index=False)

          patch_html(f"{out}/index.html", is_index=True)
          print(f"✅ 変換完了: scale={scale:.4f}, content={scaled_w}x{target_h}, left_pad={left_pad}px")

      - name: Render
        env:
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        run: |
          HF_VIDEO_COVERAGE_THRESHOLD=0 hyperframes render $SAMPLE_NAME -o raw.mp4
          ls -lh raw.mp4
          ffprobe -v quiet -select_streams v:0 -show_entries stream=width,height -of csv=p=0 raw.mp4
      - name: Generate TTS and caption composition
        env:
          SAMPLE_NAME: ${{ github.event.inputs.sample_name }}
        run: |
          pip install edge-tts --quiet 2>/dev/null
          python3 scripts/gen_caption_composition.py \
            "$SAMPLE_NAME" \
            narration.mp3 \
            captions.html \
            narration.srt
          ls -lh narration.mp3 narration.srt 2>/dev/null || true
      - name: Merge video audio character subtitles
        run: |
          python3 scripts/gen_subtitle_filter.py narration.srt narration.ass
          echo "ASS生成: $(wc -l < narration.ass)行"
          if ffmpeg -filters 2>&1 | grep -q "^.*ass"; then
            ffmpeg -y \
              -i raw.mp4 -i test_render/character_main.png -i narration.mp3 \
              -filter_complex "\
                [0:v][1:v]overlay=W-w-20:H-h-100[v1];\
                [v1]ass=narration.ass[vout]" \
              -map "[vout]" -map 2:a \
              -c:v libx264 -crf 18 -preset fast \
              -c:a aac -shortest \
              output.mp4
          else
            ffmpeg -y \
              -i raw.mp4 -i test_render/character_main.png -i narration.mp3 \
              -filter_complex "[0:v][1:v]overlay=W-w-20:H-h-100[vout]" \
              -map "[vout]" -map 2:a \
              -c:v libx264 -crf 18 -preset fast \
              -c:a aac -shortest \
              output.mp4
          fi
          ls -lh output.mp4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: landscape-vertical-${{ github.run_number }}
          path: output.mp4
          retention-days: 3
