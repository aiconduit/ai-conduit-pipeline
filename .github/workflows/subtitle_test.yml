name: Subtitle Method Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-cjk libass-dev
          pip install pillow numpy
      - name: List available fonts
        run: |
          find /usr/share/fonts -name "*CJK*" -o -name "*Noto*" | sort
          echo "---"
          fc-list | grep -i "noto\|cjk" | head -20
      - name: Run subtitle tests
        run: python3 test_subtitle_methods.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-test-results
          path: |
            /tmp/test_drawtext.mp4
            /tmp/test_ass.mp4
            /tmp/test_pillow_frame.jpg
          retention-days: 1
