name: Kaggle Wan2.2 動画生成

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Kaggle APIテスト・ノートブック作成
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kaggle requests -q
          python3 - << "PYEOF2"
          import os, json, requests, zipfile, tempfile

          user = os.environ["KAGGLE_USERNAME"]
          key = os.environ["KAGGLE_KEY"]
          auth = (user, key)
          print(f"ユーザー: {user}")

          # 認証確認
          r = requests.get("https://www.kaggle.com/api/v1/datasets/list",
                          params={"search": "wan video", "pageSize": 2},
                          auth=auth, timeout=10)
          print(f"datasets API: {r.status_code}")

          # GPU環境確認カーネル
          kernel_code = """
import subprocess
import sys

print("=== GPU環境確認 ===")
try:
    import torch
    print(f"CUDA: {torch.cuda.is_available()}")
    if torch.cuda.is_available():
        print(f"GPU: {torch.cuda.get_device_name(0)}")
        print(f"VRAM: {torch.cuda.get_device_properties(0).total_memory // 1024**3}GB")
except Exception as e:
    print(f"torch error: {e}")

print("\n=== Wan2.2インストールテスト ===")
subprocess.run([sys.executable, "-m", "pip", "install", "diffusers", "transformers", "accelerate", "-q"])
print("diffusers installed")

from diffusers import AutoencoderKLWan
print("AutoencoderKLWan import OK")
print("✅ Wan2.2動画生成準備完了")
"""

          kernel_meta = {
              "id": f"{user}/wan22-gpu-test",
              "title": "Wan2.2 GPU Test for AI Conduit",
              "code_file": "kernel.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": []
          }

          with tempfile.TemporaryDirectory() as tmpdir:
              with open(f"{tmpdir}/kernel.py", "w") as f:
                  f.write(kernel_code)
              with open(f"{tmpdir}/kernel-metadata.json", "w") as f:
                  json.dump(kernel_meta, f)

              zip_path = f"{tmpdir}/kernel.zip"
              with zipfile.ZipFile(zip_path, "w") as z:
                  z.write(f"{tmpdir}/kernel.py", "kernel.py")
                  z.write(f"{tmpdir}/kernel-metadata.json", "kernel-metadata.json")

              with open(zip_path, "rb") as f:
                  r2 = requests.post(
                      "https://www.kaggle.com/api/v1/kernels/push",
                      auth=auth,
                      files={"file": ("kernel.zip", f, "application/zip")},
                      timeout=30
                  )
              print(f"カーネルpush: {r2.status_code}")
              print(r2.text[:500])
          PYEOF2
